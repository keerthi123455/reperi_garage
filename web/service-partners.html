<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Service Partners - Reperi Garage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0A0A0A;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 32px;
            color: #D4A017;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #D4A017;
        }

        .vendor-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* COLLAPSED STATE - Photo + Info Layout */
        .vendor-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .vendor-card:hover {
            background: #2a2a2a;
            border-color: #D4A017;
            box-shadow: 0 0 15px rgba(212, 160, 23, 0.2);
        }

        .vendor-card-collapsed {
            display: flex;
            align-items: center;
            padding: 0;
            gap: 0;
        }

        /* Photo Container */
        .vendor-photo-container {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            overflow: hidden;
            background: #0a0a0a;
        }

        .vendor-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .vendor-photo.placeholder {
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #666;
        }

        /* Text Content Container */
        .vendor-info {
            flex: 1;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-width: 0;
        }

        .vendor-main-info {
            flex: 1;
            min-width: 0;
        }

        .vendor-name {
            font-size: 18px;
            font-weight: 600;
            color: #D4A017;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vendor-location {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vendor-contact {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vendor-phone {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .expand-icon {
            font-size: 24px;
            color: #D4A017;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .vendor-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        /* EXPANDED STATE - Full Details */
        .vendor-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .vendor-card.expanded .vendor-details {
            max-height: 1200px;
        }

        .expanded-content {
            padding: 20px;
            border-top: 1px solid #333;
        }

        /* Expanded Photo */
        .expanded-photo-container {
            width: 100%;
            height: auto;
            max-height: 300px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #0a0a0a;
        }

        .expanded-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .detail-section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .detail-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            font-size: 12px;
            color: #D4A017;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 14px;
            color: #ddd;
            word-break: break-word;
            line-height: 1.5;
        }

        .contact-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-call {
            background: #D4A017;
            color: #000;
        }

        .btn-call:hover {
            background: #e8b923;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
        }

        .btn-whatsapp:hover {
            background: #20ba5e;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 16px;
        }

        .search-container {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #D4A017;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: #888;
        }

        .search-input:focus {
            border-color: #e8b923;
            box-shadow: 0 0 10px rgba(212, 160, 23, 0.3);
        }

        .search-results-count {
            color: #D4A017;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 16px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .vendor-card-collapsed {
                flex-direction: column;
            }

            .vendor-photo-container {
                width: 100%;
                height: 200px;
            }

            .vendor-info {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px;
            }

            .vendor-name {
                font-size: 16px;
            }

            .vendor-location {
                font-size: 12px;
            }

            .expand-icon {
                position: absolute;
                right: 15px;
                top: 15px;
                margin: 0;
            }

            .btn {
                font-size: 12px;
                padding: 8px;
            }

            .expanded-photo-container {
                max-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Our Service Partners</h1>
            <p>Premium automotive care across Bangalore</p>
        </div>

        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="🔍 Search by name, service, owner, or phone number..."
            >
            <div id="resultsCount" class="search-results-count"></div>
        </div>

        <div id="vendorContainer" class="vendor-list">
            <div class="loading">Loading service partners...</div>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://rmvxqjyoqfinbrpubsvp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdnhxanlvcWZpbmJycHVic3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzQyNDcsImV4cCI6MjA5MjgxMDI0N30.NAxb2XnicLSaBoA4kpTFmmutT68Z2ksu-T-P_NUxy5E';

        let allVendors = [];

        // Function to generate image URL from business name
        function generateImageUrl(businessName) {
            // Convert business name to lowercase, replace spaces and special chars with hyphens
            const imageName = businessName
                .toLowerCase()
                .trim()
                .replace(/[&]/g, 'and')           // Replace & with 'and'
                .replace(/[^a-z0-9]+/g, '-')      // Replace non-alphanumeric with hyphens
                .replace(/^-|-$/g, '')             // Remove leading/trailing hyphens
                + '.jpeg';
            
            return `https://rmvxqjyoqfinbrpubsvp.supabase.co/storage/v1/object/public/vehicle-photos/${imageName}`;
        }

        async function fetchVendors() {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/trustkon_vendor_applications?select=*`,
                    {
                        method: 'GET',
                        mode: 'cors',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const vendors = await response.json();
                if (Array.isArray(vendors)) {
                    // Sort vendors: Haya Auto Gears Pvt Ltd first, rest alphabetically
                    vendors.sort((a, b) => {
                        if (a.business_name === 'Haya Auto Gears Pvt Ltd') return -1;
                        if (b.business_name === 'Haya Auto Gears Pvt Ltd') return 1;
                        return a.business_name.localeCompare(b.business_name);
                    });
                    allVendors = vendors;
                    displayVendors(vendors);
                    setupSearch();
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                document.getElementById('vendorContainer').innerHTML = 
                    '<div class="error">Unable to load service partners. Please check your connection and try again.</div>';
            }
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                const filteredVendors = filterVendors(query);
                displayVendors(filteredVendors);
                updateResultsCount(filteredVendors.length, allVendors.length);
            });
        }

        function filterVendors(query) {
            if (query === '') {
                return allVendors;
            }

            return allVendors.filter(vendor => {
                const businessName = (vendor.business_name || '').toLowerCase();
                const contactPerson = (vendor.contact_person || '').toLowerCase();
                const phone = (vendor.phone || '').toLowerCase();
                const offering = (vendor.offering || '').toLowerCase();
                const pricing = (vendor.pricing || '').toLowerCase();
                const notes = (vendor.notes || '').toLowerCase();

                return (
                    businessName.includes(query) ||
                    contactPerson.includes(query) ||
                    phone.includes(query) ||
                    offering.includes(query) ||
                    pricing.includes(query) ||
                    notes.includes(query)
                );
            });
        }

        function updateResultsCount(count, total) {
            const resultsCount = document.getElementById('resultsCount');
            if (count === 0) {
                resultsCount.textContent = 'No service partners found';
                resultsCount.style.color = '#ff6b6b';
            } else {
                resultsCount.textContent = `Showing ${count} of ${total} service partners`;
                resultsCount.style.color = '#D4A017';
            }
        }

        function displayVendors(vendors) {
            const container = document.getElementById('vendorContainer');
            container.innerHTML = '';

            if (vendors.length === 0) {
                container.innerHTML = '<div class="error">No service partners found</div>';
                return;
            }

            vendors.forEach((vendor, index) => {
                const phones = vendor.phone.split(',').map(p => p.trim());
                const primaryPhone = phones[0];
                const whatsappPhone = primaryPhone.replace(/[^\d]/g, '');

                // Get location or use a default
                const location = vendor.notes && vendor.notes.includes('Location') 
                    ? vendor.notes.split('\n')[0] 
                    : 'Bangalore';

                const card = document.createElement('div');
                card.className = 'vendor-card';
                card.innerHTML = `
                    <!-- COLLAPSED VIEW -->
                    <div class="vendor-card-collapsed">
                        <!-- Photo -->
                        <div class="vendor-photo-container">
                            ${
                                `<img src="${generateImageUrl(vendor.business_name)}" alt="${vendor.business_name}" class="vendor-photo" onerror="this.parentElement.innerHTML='<div class=\'vendor-photo placeholder\'>🚗</div>';">`
                            }
                        </div>

                        <!-- Text Info -->
                        <div class="vendor-info">
                            <div class="vendor-main-info">
                                <div class="vendor-name">${vendor.business_name}</div>
                                <div class="vendor-location">📍 ${location}</div>
                                <div class="vendor-contact">👤 ${vendor.contact_person}</div>
                                <div class="vendor-phone">📞 ${primaryPhone}</div>
                            </div>
                            <div class="expand-icon">▼</div>
                        </div>
                    </div>

                    <!-- EXPANDED VIEW -->
                    <div class="vendor-details">
                        <div class="expanded-content">
                            <!-- Large Photo in Expanded View -->
                            <div class="expanded-photo-container">
                                <img src="${generateImageUrl(vendor.business_name)}" alt="${vendor.business_name}" class="expanded-photo" onerror="this.parentElement.style.display='none';">
                            </div>

                            <div class="detail-section">
                                <div class="detail-label">Business Name</div>
                                <div class="detail-value">${vendor.business_name}</div>
                            </div>

                            <div class="detail-section">
                                <div class="detail-label">Contact Person</div>
                                <div class="detail-value">${vendor.contact_person}</div>
                            </div>

                            ${vendor.offering ? `
                                <div class="detail-section">
                                    <div class="detail-label">Services Offered</div>
                                    <div class="detail-value">${vendor.offering}</div>
                                </div>
                            ` : ''}

                            ${vendor.pricing ? `
                                <div class="detail-section">
                                    <div class="detail-label">Pricing</div>
                                    <div class="detail-value">${vendor.pricing}</div>
                                </div>
                            ` : ''}

                            <div class="detail-section">
                                <div class="detail-label">Phone Numbers</div>
                                <div class="detail-value">${vendor.phone}</div>
                            </div>

                            ${vendor.email && vendor.email !== 'Will be updated' ? `
                                <div class="detail-section">
                                    <div class="detail-label">Email</div>
                                    <div class="detail-value">${vendor.email}</div>
                                </div>
                            ` : ''}

                            ${vendor.notes ? `
                                <div class="detail-section">
                                    <div class="detail-label">Additional Information</div>
                                    <div class="detail-value">${vendor.notes}</div>
                                </div>
                            ` : ''}

                            <div class="contact-buttons">
                                <a href="tel:${primaryPhone}" class="btn btn-call">📞 Call</a>
                                <a href="https://wa.me/${whatsappPhone}" target="_blank" class="btn btn-whatsapp">💬 WhatsApp</a>
                            </div>
                        </div>
                    </div>
                `;

                card.addEventListener('click', function() {
                    this.classList.toggle('expanded');
                });

                container.appendChild(card);
            });
        }

        // Fetch vendors on page load
        fetchVendors();
    </script>
</body>
</html>
