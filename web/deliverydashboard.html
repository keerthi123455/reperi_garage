<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reperi Delivery Partner - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        #loadingScreen {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #D4A017;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #999;
            margin-top: 20px;
            font-size: 14px;
        }

        #errorScreen {
            display: none;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid #333;
        }

        .error-icon {
            font-size: 40px;
            margin-bottom: 16px;
        }

        .error-text {
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .redirect-btn {
            padding: 12px 24px;
            background: #D4A017;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        #dashboardScreen {
            display: none;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .dashboard-header h2 {
            color: #D4A017;
            font-size: 24px;
            font-weight: 900;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        .partner-info {
            background: #262626;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .partner-info .email {
            color: #D4A017;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 18px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .info-value {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.active {
            background: rgba(81, 207, 102, 0.15);
            color: #51cf66;
        }

        .status-badge.inactive,
        .status-badge.suspended {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingScreen">
            <div class="loading-spinner"></div>
            <p class="loading-text">Verifying authentication...</p>
        </div>

        <div id="errorScreen">
            <div class="error-icon">🔐</div>
            <p class="error-text" id="errorText">You must be logged in to access this page</p>
            <button class="redirect-btn" onclick="window.location.href='delivery.html'">Go to Login</button>
        </div>

        <div id="dashboardScreen">
            <div class="dashboard-header">
                <h2>🚚 Delivery Dashboard</h2>
                <button class="logout-btn" onclick="handleLogout()">LOGOUT</button>
            </div>

            <div class="partner-info">
                <div class="email" id="partnerEmail"></div>

                <div class="info-row">
                    <span class="info-label">Partner ID</span>
                    <span class="info-value" id="partnerId">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Status</span>
                    <span class="info-value" id="partnerStatus">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Rating</span>
                    <span class="info-value" id="partnerRating">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Deliveries Completed</span>
                    <span class="info-value" id="partnerDeliveries">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Partner Since</span>
                    <span class="info-value" id="partnerSince">—</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rmvxqjyoqfinbrpubsvp.supabase.co/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdnhxanlvcWZpbmJycHVic3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzQyNDcsImV4cCI6MjA5MjgxMDI0N30.NAxb2XnicLSaBoA4kpTFmmutT68Z2ksu-T-P_NUxy5E';

        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('load', async () => {
            await checkAuthentication();
        });

        async function checkAuthentication() {
            try {
                const { data: { session } } = await sbClient.auth.getSession();

                if (!session) {
                    showErrorScreen('You must be logged in to access this page');
                    return;
                }

                await showDashboard(session.user.email);
            } catch (err) {
                showErrorScreen(`Authentication error: ${err.message}`);
            }
        }

        function showErrorScreen(message) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('errorScreen').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        async function showDashboard(email) {
            try {
                // delivery_partners.id is a plain SERIAL column, unrelated
                // to the Supabase Auth user id, so the profile is looked
                // up by the (unique) email instead.
                const { data: partner, error } = await sbClient
                    .from('delivery_partners')
                    .select('id, email, status, rating, total_deliveries_completed, created_at')
                    .eq('email', email)
                    .single();

                if (error || !partner) {
                    throw new Error('No delivery partner profile found for this account.');
                }

                document.getElementById('partnerEmail').textContent = partner.email;
                document.getElementById('partnerId').textContent = partner.id;

                const statusEl = document.getElementById('partnerStatus');
                statusEl.innerHTML = `<span class="status-badge ${partner.status}">${partner.status}</span>`;

                document.getElementById('partnerRating').textContent =
                    partner.rating != null ? Number(partner.rating).toFixed(2) : '0.00';
                document.getElementById('partnerDeliveries').textContent =
                    partner.total_deliveries_completed ?? 0;
                document.getElementById('partnerSince').textContent = partner.created_at
                    ? new Date(partner.created_at).toLocaleDateString()
                    : '—';

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
            } catch (err) {
                showErrorScreen(err.message);
            }
        }

        async function handleLogout() {
            await sbClient.auth.signOut();
            window.location.href = 'delivery.html';
        }
    </script>
</body>
</html>
