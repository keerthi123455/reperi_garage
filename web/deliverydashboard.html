    <script>
      // Same OneSignal app as web/index.html and the Flutter app — this
      // just binds *this device's* push identity to whichever delivery
      // partner logs in here, using the 'delivery_<delivery_partners.id>'
      // scheme so supabase/functions/notify-on-db-change/index.ts can
      // target them.
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "6bc39a67-c05a-4ba4-b950-9ccfc8e9b9b6",
          safari_web_id: "web.onesignal.auto.195e7e66-9dea-4e11-b56c-b4a654da5ab7",
          allowLocalhostAsSecureOrigin: true,
        });
      });

      function oneSignalLogin(externalId) {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.login(externalId);
        });
      }

      function oneSignalLogout() {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.logout();
        });
      }
    </script>

<body>
    <div class="container">
        <div id="loadingScreen">
            <div class="loading-spinner"></div>
            <p class="loading-text">Verifying authentication...</p>
        </div>

        <div id="errorScreen">
            <div class="error-icon">🔐</div>
            <p class="error-text" id="errorText">You must be logged in to access this page</p>
            <button class="redirect-btn" onclick="window.location.href='delivery.html'">Go to Login</button>
        </div>

        <div id="dashboardScreen">
            <div class="card">
                <div class="dashboard-header">
                    <h2>🚚 Delivery Dashboard</h2>

    <script>
        const SUPABASE_URL = 'https://rmvxqjyoqfinbrpubsvp.supabase.co/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdnhxanlvcWZpbmJycHVic3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzQyNDcsImV4cCI6MjA5MjgxMDI0N30.NAxb2XnicLSaBoA4kpTFmmutT68Z2ksu-T-P_NUxy5E';

        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 'bookings' and 'claim_table' (claim_screen.dart's
        // paid doorstep pickup/garage/return claim) both have a real
        // garage-wait leg — the garage's own MARK AS DONE gates the
        // return trip. pollution_booking/inspection_booking don't have an
        // admin app of their own, so they skip straight from 'to_garage'
        // to 'delivered' with no such gate.
        const hasGarageLeg = (b) => b.sourceTable === 'bookings' || b.sourceTable === 'claim_table';

        // Pre-delivery inspection has no OTP handshake at all (coordination
        // happens by phone via customerPhone) and no garage/timeline legs —
        // just two flat states, so it's kept on its own short-circuit
        // rather than folded into the generic OTP-gated stage machinery
        // below (see stageOrderFor/renderStageBlock/advanceStage).
        const skipOtpFor = (b) => b.sourceTable === 'inspection_booking';

        // The fixed pickup/drop stage sequence a delivery partner drives a
        // booking through. null (not in this list) means "booked, nothing
        // done yet" — shown to the customer as "Initiating Pickup".
        //
        // hasGarageLeg tables get the full round trip: customer -> garage
        // -> customer, with an extra 'out_for_delivery' leg
        // pollution_booking/inspection_booking don't have — those have no
        // garage-wait step of their own, so they keep the original,
        // shorter sequence unchanged (still ending 'to_garage' ->
        // 'delivered' directly). Keeping two separate orders (rather than
        // one shared one) is what stops that extra leg from silently
        // applying to them too.
        const STAGE_ORDER_BOOKINGS = ['pickup_started', 'picked_up', 'to_garage', 'out_for_delivery', 'delivered'];
        const STAGE_ORDER_SIMPLE = ['pickup_started', 'picked_up', 'to_garage', 'delivered'];
        // Inspection reuses the 'pickup_started'/'delivered' values (and
        // their existing stage_*_at columns) so nothing downstream that
        // keys off "the terminal value is 'delivered'" — e.g.
        // vehicle_bookings_screen.dart's delete-vehicle guard — needs to
        // change, but skips 'picked_up'/'to_garage' entirely: just two
        // flat states, shown with their own wording below.
        const STAGE_ORDER_INSPECTION = ['pickup_started', 'delivered'];
        const stageOrderFor = (b) => {
            if (b.sourceTable === 'inspection_booking') return STAGE_ORDER_INSPECTION;
            return hasGarageLeg(b) ? STAGE_ORDER_BOOKINGS : STAGE_ORDER_SIMPLE;
        };

        const STAGE_COLUMN = {
            pickup_started: 'stage_pickup_started_at',
            picked_up: 'stage_picked_up_at',
            to_garage: 'stage_to_garage_at',
            out_for_delivery: 'stage_out_for_delivery_at',
            delivered: 'stage_delivered_at',
        };
        const STAGE_LABEL = {
            null: 'Initiating Pickup',
            pickup_started: 'Pickup Started',
            picked_up: 'Vehicle Picked Up',
            to_garage: 'Vehicle At Garage',
            out_for_delivery: 'Out For Delivery',
            delivered: 'Vehicle Delivered',
        };
        // Pollution-certificate bookings show different wording for the
        // same underlying stage values (no new stages, just display) —
        // mirrors vehicle_bookings_screen.dart's _DeliveryStageTracker
        // isPollutionCertificate branch on the customer side. Inspection
        // has its own wording below instead (STAGE_LABEL_INSPECTION).
        const STAGE_LABEL_POLLUTION = {
            null: 'Initiating Pickup',
            pickup_started: 'Car Pickup',
            picked_up: 'Getting Certificate',
            to_garage: 'Out For Delivery',
            delivered: 'Delivered',
        };
        // Inspection: just two states, no OTP/timeline wording at all —
        // see STAGE_ORDER_INSPECTION above.
        const STAGE_LABEL_INSPECTION = {
            null: 'Not Started',
            pickup_started: 'Inspection Started',
            delivered: 'Inspection Done',
        };
        const stageLabelFor = (b) => {
            if (b.sourceTable === 'inspection_booking') return STAGE_LABEL_INSPECTION[b.deliveryStage];
            return (b.sourceTable === 'pollution_booking' ? STAGE_LABEL_POLLUTION : STAGE_LABEL)[b.deliveryStage];
        };
        // What the button says to move OUT of the given current stage —
        // 'to_garage' differs by sourceTable (bookings' own version of
        // this text is never actually read; renderGarageWaitBlock always
        // renders its own explicit "Picked Up" button instead once
        // unlocked, but this stays defined for consistency/fallback).
        const NEXT_BUTTON_LABEL_BOOKINGS = {
            null: 'Start Pickup',
            pickup_started: 'Vehicle Picked Up',
            picked_up: 'Vehicle To Garage',
            to_garage: 'Picked Up',
            out_for_delivery: 'Vehicle Delivered',
        };
        const NEXT_BUTTON_LABEL_SIMPLE = {
            null: 'Start Pickup',
            pickup_started: 'Vehicle Picked Up',
            picked_up: 'Vehicle To Garage',
            to_garage: 'Vehicle Delivered',
        };
        const NEXT_BUTTON_LABEL_POLLUTION = {
            null: 'Start Pickup',
            pickup_started: 'Car Picked Up',
            picked_up: 'Out For Delivery',
            to_garage: 'Delivered',
        };
        // The only two buttons this booking type ever shows.
        const NEXT_BUTTON_LABEL_INSPECTION = {
            null: 'Inspection Started',
            pickup_started: 'Inspection Done',
        };
        const nextButtonLabelFor = (b) => {
            if (b.sourceTable === 'inspection_booking') return NEXT_BUTTON_LABEL_INSPECTION[b.deliveryStage];
            if (hasGarageLeg(b)) return NEXT_BUTTON_LABEL_BOOKINGS[b.deliveryStage];
            if (b.sourceTable === 'pollution_booking') return NEXT_BUTTON_LABEL_POLLUTION[b.deliveryStage];
            return NEXT_BUTTON_LABEL_SIMPLE[b.deliveryStage];
        };

        function nextStage(b) {
            const order = stageOrderFor(b);
            const current = b.deliveryStage;
            if (current == null) return order[0];
            const idx = order.indexOf(current);
            if (idx === -1 || idx === order.length - 1) return null;
            return order[idx + 1];
        }

        let currentPartnerId = null;
        let autoRefreshTimer = null;
        // Keyed by "sourceTable::id" so the inline onclick handlers below
        // don't need to smuggle a JSON blob through an HTML attribute.
        let bookingsIndex = {};
        const keyFor = (b) => `${b.sourceTable}::${b.id}`;

        window.addEventListener('load', async () => {
            await checkAuthentication();
        });

        async function checkAuthentication() {
            try {
                const { data: { session } } = await sbClient.auth.getSession();

                if (!session) {
                    showErrorScreen('You must be logged in to access this page');
                    return;
                }

                await showDashboard(session.user.email);
            } catch (err) {
                showErrorScreen(`Authentication error: ${err.message}`);
            }
        }

        function showErrorScreen(message) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('errorScreen').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        async function showDashboard(email) {
            try {
                // delivery_partners.id is a plain SERIAL column, unrelated
                // to the Supabase Auth user id, so the profile is looked
                // up by the (unique) email instead.
                const { data: partner, error } = await sbClient
                    .from('delivery_partners')
                    .select('id, email, status, rating, total_deliveries_completed, created_at')
                    .eq('email', email)
                    .single();

                if (error || !partner) {
                    throw new Error('No delivery partner profile found for this account.');
                }

                currentPartnerId = partner.id;
                oneSignalLogin('delivery_' + currentPartnerId);

                document.getElementById('partnerEmail').textContent = partner.email;
                document.getElementById('partnerId').textContent = partner.id;

                const statusEl = document.getElementById('partnerStatus');
                statusEl.innerHTML = `<span class="status-badge ${partner.status}">${partner.status}</span>`;

                document.getElementById('partnerRating').textContent =
                    partner.rating != null ? Number(partner.rating).toFixed(2) : '0.00';
                document.getElementById('partnerDeliveries').textContent =
                    partner.total_deliveries_completed ?? 0;
                document.getElementById('partnerSince').textContent = partner.created_at
                    ? new Date(partner.created_at).toLocaleDateString()
                    : '—';

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';

                await fetchAssignedBookings(partner.id);

                // Nothing pushes a change the garage or customer makes
                // (MARK AS DONE, entering a return code) into this
                // dashboard on its own — poll instead of leaving the
                // partner to keep tapping "Check Again" themselves.
                if (!autoRefreshTimer) {
                    autoRefreshTimer = setInterval(() => {
                        fetchAssignedBookings(currentPartnerId);
                    }, 15000);
                }
            } catch (err) {
                showErrorScreen(err.message);
            }
        }

        // Pulls this partner's assigned rows from all three booking-type
        // tables (they're separate tables, not one shared one — see
        // payment_screen.dart / pollution_screen.dart / inspection_
        // screen.dart in the app) and normalizes them into one shape so
        // they can be rendered as a single merged, sorted list.
        async function fetchAssignedBookings(partnerId) {
            fetchFleetTrips();
            const bookingsContent = document.getElementById('bookingsContent');

            try {
                const [bookingsRes, pollutionRes, inspectionRes, claimRes] = await Promise.all([
                    // 'bookings' and 'claim_table' both join the
                    // assigned garage's own location — that's what the
                    // return trip (picking the finished car back up FROM
                    // the garage) navigates to. pollution_booking/
                    // inspection_booking don't carry assigned_to_admin_id,
                    // so they're left as-is.
                    sbClient.from('bookings')
                        .select('*, admin:assigned_to_admin_id(username, latitude, longitude)')
                        .eq('delivery_partner_id', partnerId),
                    sbClient.from('pollution_booking').select('*').eq('delivery_partner_id', partnerId),
                    sbClient.from('inspection_booking').select('*').eq('delivery_partner_id', partnerId),
                    // claim_table (claim_screen.dart) is now
                    // a full doorstep pickup/garage/return trip just like
                    // 'bookings', driven the same way here — see
                    // stageOrderFor/renderStageBlock/navigateTargetFor.
                    sbClient.from('claim_table')
                        .select('*, admin:assigned_to_admin_id(username, latitude, longitude)')
                        .eq('delivery_partner_id', partnerId),
                ]);

                if (bookingsRes.error) throw bookingsRes.error;
                if (pollutionRes.error) throw pollutionRes.error;
                if (inspectionRes.error) throw inspectionRes.error;
                if (claimRes.error) throw claimRes.error;

                const normalize = (rows, typeLabel, defaultTitle, sourceTable) => (rows || []).map((r) => ({
                    sourceTable,
                    id: r.id,
                    typeLabel,
                    title: r.package_name || defaultTitle,
                    price: r.package_price || r.price || null,
                    status: r.payment_status || r.status || 'unknown',
                    isCod: (r.payment_status || '').toLowerCase() === 'cod',
                    pickupAddress: r.pickup_address,
                    pickupAddressName: r.pickup_address_name,
                    pickupLat: r.pickup_latitude,
                    pickupLng: r.pickup_longitude,
                    dropoffLat: r.dropoff_latitude,
                    dropoffLng: r.dropoff_longitude,
                    pickupDrop: r.pickupdrop,
                    createdAt: r.created_at,
                    deliveryStage: r.delivery_stage || null,
                    stageTimestamps: {
                        pickup_started: r.stage_pickup_started_at,
                        picked_up: r.stage_picked_up_at,
                        to_garage: r.stage_to_garage_at,
                        out_for_delivery: r.stage_out_for_delivery_at,
                        delivered: r.stage_delivered_at,
                    },
                    pickupOtpCode: r.pickup_otp_code || null,
                    pickupOtpVerifiedAt: r.pickup_otp_verified_at || null,
                    returnOtpCode: r.return_otp_code || null,
                    returnOtpVerifiedAt: r.return_otp_verified_at || null,
                    // Set on 'bookings' (booking_status) or 'claim_table'
                    // (claim_status, via claim_details_screen.dart's
                    // own MARK AS DONE) — both flip to 'Ready for Pickup'
                    // once the garage finishes the work.
                    bookingStatus: r.booking_status || r.claim_status || null,
                    garageName: r.admin?.username || null,
                    garageLat: r.admin?.latitude ?? null,
                    garageLng: r.admin?.longitude ?? null,
                    // Only set on inspection_booking — snapshotted at
                    // booking time by inspection_screen.dart's PLAN
                    // INSPECTION popup, since these rows have no in-app
                    // OTP/timeline flow (see renderStageBlock's skipOtp)
                    // and coordination happens by phone instead.
                    vehicleCondition: r.vehicle_condition || null,
                    vehicleType: r.vehicle_type || null,
                    slotDate: r.slot_date || null,
                    slotTime: r.slot_time || null,
                    slotStart: r.slot_start || null,
                    slotMode: r.slot_mode || null,
                    // customer_name/customer_phone are now snapshotted at
                    // booking time on every table (payment_screen.dart,
                    // inspection_screen.dart, pollution_screen.dart,
                    // claim_screen.dart) — same reasoning as above: this
                    // dashboard runs on the anon key with no route to
                    // auth.users, so the tap-to-call number has to live on
                    // the row itself. See renderCustomerContactRow below.
                    customerName: r.customer_name || null,
                    customerPhone: r.customer_phone || null,
                    // Inspection visits (see renderInspectionVisitCard).
                    inspectionStage: r.inspection_stage || null,
                    inspectionPhotos: Array.isArray(r.inspection_photos) ? r.inspection_photos : [],
                    inspectionCompletedAt: r.inspection_completed_at || null,
                }));

                const all = [
                    ...normalize(bookingsRes.data, 'Service Booking', 'Service Booking', 'bookings'),
                    ...normalize(pollutionRes.data, 'Pollution Certificate', 'Pollution Certificate Check', 'pollution_booking'),
                    ...normalize(inspectionRes.data, 'Vehicle Inspection', 'Vehicle Inspection', 'inspection_booking'),
                    ...normalize(claimRes.data, 'Claim Assistance', 'Claim Assistance', 'claim_table'),
                ];

                // Open trips with a picked time first, soonest slot on top;
                // everything else newest first, as before.
                const upcoming = (b) => b.slotStart && b.deliveryStage !== 'delivered';
                all.sort((a, b) => {
                    const ua = upcoming(a), ub = upcoming(b);
                    if (ua && ub) return new Date(a.slotStart) - new Date(b.slotStart);
                    if (ua !== ub) return ua ? -1 : 1;
                    return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
                });

                bookingsIndex = {};
                all.forEach((b) => { bookingsIndex[keyFor(b)] = b; });

                displayBookings(all);
            } catch (err) {
                bookingsContent.innerHTML = `
                    <div class="no-bookings">
                        <p>❌ Error loading bookings: ${err.message}</p>
                    </div>
                `;
            }
        }

        function navigateUrl(lat, lng) {
            return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
        }

        function displayBookings(bookings) {
            const bookingsContent = document.getElementById('bookingsContent');

            if (!bookings.length) {
                bookingsContent.innerHTML = `
                    <div class="no-bookings">
                        <p>No bookings assigned yet.</p>
                    </div>
                `;
                return;
            }

            bookingsContent.innerHTML = `
                <div class="bookings-list">
                    ${bookings.map(renderBookingCard).join('')}
                </div>
            `;
            loadInspPhotoUrls().catch(() => {});
        }

        function formatFullDateTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleString(undefined, {
                weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
                hour: 'numeric', minute: '2-digit',
            });
        }

        // Date-only formatter for inspection_booking's slot_date (a plain
        // DATE column, no time component) — formatFullDateTime always
        // includes a time, which would show a spurious midnight here.
        function formatSlotDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(`${dateStr}T00:00:00`);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleDateString(undefined, {
                weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
            });
        }

        // Only bookings actually being picked up/dropped off ever get a
        // delivery_partner_id assigned in the first place (see
        // payment_screen.dart's _pickupDropYes), so every card here has
        // pickupdrop = 'yes' in practice — but check explicitly anyway
        // rather than assuming.
        function renderStageBlock(b) {
            if ((b.pickupDrop || '').toLowerCase() !== 'yes') return '';

            const stage = b.deliveryStage;
            const label = stageLabelFor(b);
            const updatedAt = stage ? b.stageTimestamps[stage] : b.createdAt;
            const nextLabel = nextButtonLabelFor(b);

            const updatedHtml = updatedAt
                ? `<div class="stage-updated">Updated: ${escapeHtml(formatFullDateTime(updatedAt))}</div>`
                : '';

            // Pre-delivery inspection has no in-app OTP exchange at all —
            // it's a pre-scheduled slot booking (see renderInspectionDetails'
            // customer phone number) rather than a spontaneous doorstep
            // pickup, so there's no customer waiting in the app to verify a
            // code either. Plain advance buttons throughout instead.
            const skipOtp = skipOtpFor(b);

            let actionHtml;
            if (stage === 'delivered') {
                actionHtml = b.sourceTable === 'inspection_booking'
                    ? `<span class="delivered-pill">✅ Inspection Completed</span>`
                    : `<span class="delivered-pill">✅ Trip Completed</span>`;
            } else if (stage === 'pickup_started' && !skipOtp) {
                // Gate "Vehicle Picked Up" on the customer verifying this
                // partner by OTP first — see generateOtpByKey/renderStageBlock's
                // OTP block below, and _PickupOtpVerification in
                // vehicle_bookings_screen.dart on the customer side.
                actionHtml = renderPickupOtpBlock(b);
            } else if (hasGarageLeg(b) && stage === 'to_garage') {
                // Gate "Picked Up" (from the garage) on the garage's own
                // MARK AS DONE — see renderGarageWaitBlock below.
                actionHtml = renderGarageWaitBlock(b);
            } else if (nextStage(b) === 'delivered' && !skipOtp) {
                // Final leg back to the customer — 'out_for_delivery' for
                // 'bookings', 'to_garage' for pollution/inspection (they
                // skip the out_for_delivery leg). Gate it on a return OTP,
                // mirroring renderPickupOtpBlock for the initial pickup.
                actionHtml = renderReturnOtpBlock(b);
            } else {
                actionHtml = `<button class="advance-btn" onclick="advanceStageByKey('${keyFor(b)}')">${escapeHtml(nextLabel)}</button>`;
            }

            return `
                <div class="stage-block">
                    <div class="stage-current">${escapeHtml(label)}</div>
                    ${updatedHtml}
                    ${actionHtml}
                </div>
            `;
        }

        // Shown only while stage === 'pickup_started' — walks the partner
        // through generating a code, reading it to the customer, and
        // waiting for the customer to key it into the app before the
        // "Vehicle Picked Up" button becomes available at all.
        function renderPickupOtpBlock(b) {
            if (b.pickupOtpVerifiedAt) {
                const pickedUpLabel = b.sourceTable === 'pollution_booking' ? 'Car Picked Up' : 'Vehicle Picked Up';
                return `
                    <div class="otp-verified">✅ Customer verified you — go ahead and take the vehicle.</div>
                    <button class="advance-btn" onclick="advanceStageByKey('${keyFor(b)}')">${pickedUpLabel}</button>
                `;
            }

            if (b.pickupOtpCode) {
                return `
                    <div class="otp-box">
                        <div class="otp-box-label">Tell the customer this code:</div>
                        <div class="otp-code">${escapeHtml(b.pickupOtpCode)}</div>
                        <div class="otp-box-hint">Waiting for the customer to enter it in their app…</div>
                        <button class="advance-btn secondary" onclick="fetchAssignedBookings(currentPartnerId)">Check Again</button>
                    </div>
                `;
            }

            return `
                <div class="otp-box">
                    <div class="otp-box-hint">At the pickup location? Generate a code and read it to the customer before taking the vehicle.</div>
                    <button class="advance-btn" onclick="generateOtpByKey('${keyFor(b)}')">Generate Pickup OTP</button>
                </div>
            `;
        }

        // Shown only for hasGarageLeg rows sitting at stage === 'to_garage'
        // — the partner already dropped the vehicle off; this is the wait
        // for the garage itself to finish the work (bookingStatus becomes
        // 'Ready for Pickup' via booking_details_screen.dart's or
        // claim_details_screen.dart's own MARK AS DONE) before
        // "Picked Up" (from the garage) unlocks.
        function renderGarageWaitBlock(b) {
            if (b.bookingStatus === 'Ready for Pickup') {
                return `
                    <div class="otp-verified">✅ Ready for pickup from ${escapeHtml(b.garageName || 'the garage')}.</div>
                    <button class="advance-btn" onclick="advanceStageByKey('${keyFor(b)}')">Picked Up</button>
                `;
            }
            return `
                <div class="otp-box">
                    <div class="otp-box-hint">Vehicle dropped at ${escapeHtml(b.garageName || 'the garage')} — waiting for them to finish the service.</div>
                    <button class="advance-btn secondary" onclick="fetchAssignedBookings(currentPartnerId)">Check Again</button>
                </div>
            `;
        }

        // Shown on the leg immediately before 'delivered' — confirms the
        // customer actually received their vehicle back before the trip
        // can be closed out. Mirrors renderPickupOtpBlock exactly, just
        // against the return_otp_* columns instead of pickup_otp_*.
        function renderReturnOtpBlock(b) {
            if (b.returnOtpVerifiedAt) {
                if (b.isCod) {
                    return `
                        <div class="otp-verified">✅ Customer confirmed receiving the vehicle.</div>
                        <div class="cash-box">
                            <div class="cash-box-title">💰 COLLECT PAYMENT${b.price ? `: ${escapeHtml(String(b.price))}` : ''}</div>
                            <div class="cash-box-hint">This is a Cash on Pickup booking — take the payment by UPI (our QR) or cash before completing the trip.</div>
                            <button class="advance-btn cash-confirm-btn" onclick="confirmCashAndDeliver('${keyFor(b)}')">Collect payment — Complete Delivery</button>
                        </div>
                    `;
                }
                return `
                    <div class="otp-verified">✅ Customer confirmed receiving the vehicle.</div>
                    <button class="advance-btn" onclick="advanceStageByKey('${keyFor(b)}')">Vehicle Delivered</button>
                `;
            }

            if (b.returnOtpCode) {
                return `
                    <div class="otp-box">
                        <div class="otp-box-label">Tell the customer this code:</div>
                        <div class="otp-code">${escapeHtml(b.returnOtpCode)}</div>
                        <div class="otp-box-hint">Waiting for the customer to enter it in their app…</div>
                        <button class="advance-btn secondary" onclick="fetchAssignedBookings(currentPartnerId)">Check Again</button>
                    </div>
                `;
            }

            return `
                <div class="otp-box">
                    <div class="otp-box-hint">At the customer's location? Generate a code and read it to them before handing back the vehicle.</div>
                    <button class="advance-btn" onclick="generateReturnOtpByKey('${keyFor(b)}')">Generate Return OTP</button>
                </div>
            `;
        }

        // The Navigate button's destination changes with the trip leg:
        // heading to collect the vehicle from the customer, from the
        // garage (once dropped off there), or back out to the customer
        // for the final drop-off. Only hasGarageLeg rows have a garage leg
        // at all — pollution_booking/inspection_booking just navigate to
        // the pickup address throughout, same as before this feature.
        function navigateTargetFor(b) {
            if (hasGarageLeg(b)) {
                const stage = b.deliveryStage;
                if (stage === 'picked_up' || stage === 'to_garage') {
                    return (b.garageLat != null && b.garageLng != null)
                        ? { lat: b.garageLat, lng: b.garageLng, label: 'Navigate to Garage' }
                        : null;
                }
                if (stage === 'out_for_delivery' || stage === 'delivered') {
                    const lat = b.dropoffLat ?? b.pickupLat;
                    const lng = b.dropoffLng ?? b.pickupLng;
                    return (lat != null && lng != null)
                        ? { lat, lng, label: 'Navigate to Customer' }
                        : null;
                }
            }
            return (b.pickupLat != null && b.pickupLng != null)
                ? { lat: b.pickupLat, lng: b.pickupLng, label: 'Navigate to Customer' }
                : null;
        }

        function renderBookingCard(b) {
            // Expert visits get their own blue tile.
            if (b.inspectionStage) return renderInspectionVisitCard(b);
            const target = navigateTargetFor(b);
            const navigateHtml = target
                ? `<a class="navigate-btn" href="${navigateUrl(target.lat, target.lng)}" target="_blank" rel="noopener">🧭 ${escapeHtml(target.label)}</a>`
                : `<span class="navigate-btn disabled">🧭 No location</span>`;

            return `
                <div class="booking-card">
                    <div class="booking-header">
                        <div>
                            <div class="booking-title">${escapeHtml(b.title)}</div>
                            <div class="booking-type">${escapeHtml(b.typeLabel)}</div>
                        </div>
                        <div>
                            ${b.price ? `<div class="booking-price">${escapeHtml(String(b.price))}</div>` : ''}
                            ${b.isCod ? `<div class="cod-pill">💰 Collect payment</div>` : ''}
                        </div>
                    </div>
                    ${renderSlotBanner(b)}
                    <div class="booking-detail-row"><strong>Booked:</strong> ${escapeHtml(formatFullDateTime(b.createdAt))}</div>
                    <div class="booking-detail-row"><strong>Status:</strong> ${escapeHtml(b.status)}</div>
                    <div class="booking-detail-row"><strong>Pickup${b.pickupAddressName ? ` (${escapeHtml(b.pickupAddressName)})` : ''}:</strong> ${escapeHtml(b.pickupAddress || 'Not specified')}</div>
                    ${renderInspectionDetails(b)}
                    ${renderCustomerContactRow(b)}
                    <div class="booking-footer">
                        ${b.pickupDrop ? `<span class="pickupdrop-pill">Pickup &amp; Drop: ${escapeHtml(b.pickupDrop)}</span>` : '<span></span>'}
                        ${navigateHtml}
                    </div>
                    ${renderStageBlock(b)}
                </div>
            `;
        }

        // Pre-delivery inspection has no in-app timeline/OTP — the vehicle
        // condition/type and scheduled slot the customer chose in
        // inspection_screen.dart's PLAN INSPECTION popup are what the
        // partner needs instead to coordinate the visit (the customer
        // contact/call row itself is rendered separately below, since
        // every booking type shows it now, not just inspection).
        function renderInspectionDetails(b) {
            if (b.sourceTable !== 'inspection_booking') return '';

            // The slot itself is shown by renderSlotBanner on every card.
            return `
                <div class="booking-detail-row"><strong>Vehicle:</strong> ${escapeHtml(b.vehicleCondition || '—')} ${escapeHtml(b.vehicleType || '')}</div>
            `;
        }

        // The day + time window the customer picked in the app, at the top
        // of every card. Red when it starts within 2 hours (or has started)
        // and the trip hasn't been started yet.
        const SLOT_MODE_TEXT = {
            pickup: '🚗 Pick up the car from the customer in this window',
            garage_drop: '🏠 Customer drops the car at the garage in this window',
            doorstep: '📍 Visit the customer in this window',
        };
        function renderSlotBanner(b) {
            if (!b.slotDate) return '';
            const date = formatSlotDate(String(b.slotDate).slice(0, 10));
            const startMs = b.slotStart ? new Date(b.slotStart).getTime() : NaN;
            const notStarted = !b.deliveryStage;
            const soon = notStarted && !isNaN(startMs) && startMs - Date.now() < 2 * 3600 * 1000;
            const modeText = SLOT_MODE_TEXT[b.slotMode] || 'Scheduled slot';
            return `
                <div class="slot-banner${soon ? ' soon' : ''}">
                    <div class="slot-icon">🕒</div>
                    <div>
                        <div class="slot-when">${escapeHtml(date)}${b.slotTime ? ` • ${escapeHtml(b.slotTime)}` : ''}</div>
                        <div class="slot-mode">${escapeHtml(modeText)}</div>
                    </div>
                </div>
            `;
        }

        // Every delivery booking (not just inspection) now snapshots
        // customer_name/customer_phone at booking time — see the comment
        // by normalize()'s customerPhone field — so the partner can always
        // reach the customer directly, tap-to-call, without needing to go
        // through in-app chat.
        function renderCustomerContactRow(b) {
            return `
                <div class="booking-detail-row">
                    <strong>Customer:</strong> ${escapeHtml(b.customerName || 'Not specified')}
                    ${b.customerPhone
                        ? ` — <a class="call-link" href="tel:${escapeHtml(b.customerPhone)}">📞 ${escapeHtml(b.customerPhone)}</a>`
                        : ' — no phone on file'}
                </div>
            `;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function advanceStageByKey(key) {
            const booking = bookingsIndex[key];
            if (booking) await advanceStage(booking);
        }

        // COD equivalent of advanceStageByKey for the final "Vehicle
        // Delivered" tap — makes sure the partner explicitly confirms cash
        // was actually collected (rather than just tapping through) before
        // the trip is closed out. See renderReturnOtpBlock's b.isCod branch.
        async function confirmCashAndDeliver(key) {
            const booking = bookingsIndex[key];
            if (!booking) return;

            // UPI (our QR) or cash — then complete the delivery and save
            // which one it was.
            const p = booking.price;
            const amount = p == null || p === '' ? ''
                : (/^\d+(\.\d+)?$/.test(String(p)) ? '₹' + Number(p).toLocaleString('en-IN') : String(p));
            const method = await collectPayment(amount);
            if (!method) return;

            await advanceStage(booking, method);
        }

        // ── Collect payment: UPI (the QR picked in the CRM) or cash ─────
        // Resolves 'upi' / 'cash' once confirmed, or null if cancelled.
        // Same flow as the garage app (supabase/payment_collection.sql).
        function cpEsc(v) {
            return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function cpOverlay(html, center) {
            const dim = document.createElement('div');
            dim.className = 'cp-dim' + (center ? ' center' : '');
            dim.innerHTML = html;
            document.body.appendChild(dim);
            return dim;
        }
        function collectPayment(amountText) {
            const amt = cpEsc(amountText || '—');
            return new Promise((resolve) => {
                const choose = () => {
                    const dim = cpOverlay(`<div class="cp-sheet" role="dialog" aria-label="Collect payment">
                        <div class="cp-handle"></div>
                        <div class="cp-h">Collect payment</div>
                        <div class="cp-sub">How is the customer paying?</div>
                        <div class="cp-amt">${amt}</div>
                        <button class="cp-opt" data-m="upi"><div class="cp-ic" style="background:#E6EEFF">📱</div><div><b>UPI</b><span>Show our QR — the customer scans and pays</span></div></button>
                        <button class="cp-opt" data-m="cash"><div class="cp-ic" style="background:#E3F6E8">💵</div><div><b>Cash</b><span>The customer pays you in cash</span></div></button>
                        <button class="cp-btn cp-ghost" data-m="">Cancel</button>
                    </div>`);
                    dim.addEventListener('click', (e) => {
                        const b = e.target.closest('[data-m]');
                        if (!b && e.target !== dim) return;
                        dim.remove();
                        const m = b ? b.dataset.m : '';
                        if (m === 'upi') upi();
                        else if (m === 'cash') cash();
                        else resolve(null);
                    });
                };
                const cash = () => {
                    const dim = cpOverlay(`<div class="cp-dialog" role="dialog" aria-label="Cash received?">
                        <div style="font-size:42px">💵</div>
                        <div class="cp-h" style="margin-top:6px">Cash received?</div>
                        <div class="cp-sub">Did you collect <b style="color:#15171A">${amt}</b> in cash from the customer?</div>
                        <div class="cp-row"><button class="cp-btn cp-ghost" data-a="no">No</button><button class="cp-btn cp-green" data-a="yes">Yes, received</button></div>
                    </div>`, true);
                    dim.addEventListener('click', (e) => {
                        const b = e.target.closest('[data-a]');
                        if (!b) return;
                        dim.remove();
                        resolve(b.dataset.a === 'yes' ? 'cash' : null);
                    });
                };
                const upi = async () => {
                    const dim = cpOverlay(`<div class="cp-sheet" role="dialog" aria-label="Scan to pay">
                        <div class="cp-handle"></div>
                        <div class="cp-h" style="text-align:center">Scan to pay</div>
                        <div class="cp-amt" style="text-align:center">${amt}</div>
                        <div data-qr><div class="cp-spin"></div></div>
                        <div class="cp-note">Check the customer's phone shows <b>"Payment successful"</b> for ${amt} before tapping below.</div>
                        <button class="cp-btn cp-green" data-u="done">✅ PAYMENT DONE</button>
                        <button class="cp-btn cp-ghost" data-u="back">Back</button>
                    </div>`);
                    dim.addEventListener('click', (e) => {
                        const b = e.target.closest('[data-u]');
                        if (!b) return;
                        dim.remove();
                        if (b.dataset.u === 'done') resolve('upi'); else choose();
                    });
                    const box = dim.querySelector('[data-qr]');
                    try {
                        const { data, error } = await sbClient.rpc('active_payment_qr');
                        if (error) throw error;
                        const qr = Array.isArray(data) ? data[0] : data;
                        box.innerHTML = qr && qr.image_url
                            ? `<div class="cp-qr"><img src="${cpEsc(qr.image_url)}" alt="Payment QR"><div class="cp-qr-name">${cpEsc(qr.label)}</div></div>`
                            : '<div class="cp-err">No payment QR is set up yet. Please take cash, or ask Reperi to add the QR in the CRM.</div>';
                    } catch (err) {
                        console.error('QR load failed:', err);
                        box.innerHTML = '<div class="cp-err">Couldn\'t load the QR. Check the internet and try again, or take cash.</div>';
                    }
                };
                choose();
            });
        }

        // Saves how it was paid. Never blocks closing the job.
        async function recordCollection(table, id, method) {
            try {
                const { error } = await sbClient.rpc('record_payment_collection', {
                    p_table: table, p_id: String(id), p_method: method,
                });
                if (error) throw error;
            } catch (err) {
                console.warn('Could not save payment method:', err.message || err);
            }
        }


        // Generates a fresh 4-digit pickup code and saves it — the render
        // above then shows it big for the partner to read to the customer,
        // and switches to "waiting for verification" until the customer
        // enters it correctly in the app (which sets pickup_otp_verified_at).
        async function generateOtpByKey(key) {
            const booking = bookingsIndex[key];
            if (!booking) return;

            const code = String(Math.floor(1000 + Math.random() * 9000));

            const { error } = await sbClient
                .from(booking.sourceTable)
                .update({ pickup_otp_code: code, pickup_otp_generated_at: new Date().toISOString() })
                .eq('id', booking.id);

            if (error) {
                alert('Failed to generate OTP: ' + error.message);
                return;
            }

            await fetchAssignedBookings(currentPartnerId);
        }

        // Same idea as generateOtpByKey, for the return leg — writes
        // return_otp_code/return_otp_generated_at instead.
        async function generateReturnOtpByKey(key) {
            const booking = bookingsIndex[key];
            if (!booking) return;

            const code = String(Math.floor(1000 + Math.random() * 9000));

            const { error } = await sbClient
                .from(booking.sourceTable)
                .update({ return_otp_code: code, return_otp_generated_at: new Date().toISOString() })
                .eq('id', booking.id);

            if (error) {
                alert('Failed to generate OTP: ' + error.message);
                return;
            }

            await fetchAssignedBookings(currentPartnerId);
        }

        async function advanceStage(booking, collectedVia = null) {
            const next = nextStage(booking);
            if (!next) return; // already delivered — trip is closed

            // Defense in depth — the button to reach here shouldn't even
            // render until the customer has verified the OTP (see
            // renderPickupOtpBlock), but guard the actual write too in
            // case of a stale render/double-click. Inspection has no OTP
            // step at all (skipOtpFor), so it's exempt — otherwise this
            // would permanently block "Inspection Done" from ever firing.
            if (!skipOtpFor(booking) && booking.deliveryStage === 'pickup_started' && !booking.pickupOtpVerifiedAt) {
                alert('Ask the customer to verify your pickup OTP in their app first.');
                return;
            }

            // Same idea for the return leg — "Picked Up" (from the
            // garage) shouldn't render until the garage has marked the
            // service done, but guard the write too.
            if (hasGarageLeg(booking) &&
                booking.deliveryStage === 'to_garage' &&
                booking.bookingStatus !== 'Ready for Pickup') {
                alert('Waiting for the garage to mark this service as done first.');
                return;
            }

            // Return-leg equivalent of the pickup-OTP guard above — the
            // final "Vehicle Delivered" tap shouldn't reach here until the
            // customer has verified the return code in their app. Same
            // inspection exemption as above.
            if (!skipOtpFor(booking) && next === 'delivered' && !booking.returnOtpVerifiedAt) {
                alert('Ask the customer to verify your return OTP in their app first.');
                return;
            }

            const column = STAGE_COLUMN[next];
            const nowIso = new Date().toISOString();

            const { error } = await sbClient
                .from(booking.sourceTable)
                .update({ delivery_stage: next, [column]: nowIso })
                .eq('id', booking.id);

            if (error) {
                alert('Failed to update stage: ' + error.message);
                return;
            }

            if (collectedVia) {
                await recordCollection(booking.sourceTable, booking.id, collectedVia);
            }

            if (next === 'delivered') {
                await incrementDeliveriesCompleted();
            }

            await fetchAssignedBookings(currentPartnerId);
        }

        async function incrementDeliveriesCompleted() {
            const { data, error } = await sbClient
                .from('delivery_partners')
                .select('total_deliveries_completed')
                .eq('id', currentPartnerId)
                .single();

            if (error || !data) return;

            const updated = (data.total_deliveries_completed || 0) + 1;

            await sbClient
                .from('delivery_partners')
                .update({ total_deliveries_completed: updated })
                .eq('id', currentPartnerId);

            document.getElementById('partnerDeliveries').textContent = updated;
        }

        // ── Inspection visits ───────────────────────────────────────────
        // Doorstep Car Inspection ('bookings') and Vehicle Health Check
        // ('inspection_booking'). The CRM assigns the expert; the expert taps
        // through the steps here and adds photos the customer and the CRM
        // see. Every write goes through checked database functions (see
        // supabase/inspection_visits.sql), which also notify the customer.
        const INSP_STEPS = ['assigned', 'on_the_way', 'analyzing', 'completed'];
        const INSP_LABELS = { assigned: 'Assigned', on_the_way: 'On the way', analyzing: 'Analyzing', completed: 'Completed' };
        const inspPhotoUrls = {}; // storage path → signed URL (reused across refreshes)
        let inspBusy = false;

        function renderInspectionVisitCard(b) {
            const key = keyFor(b);
            const stage = b.inspectionStage === 'assigning' ? 'assigned' : b.inspectionStage;
            const idx = INSP_STEPS.indexOf(stage);
            const photos = b.inspectionPhotos || [];
            const title = b.sourceTable === 'inspection_booking'
                ? `Vehicle Health Check${b.vehicleType ? ` (${b.vehicleType})` : ''}`
                : (b.title || 'Doorstep Car Inspection');
            const hasLoc = b.pickupLat != null && b.pickupLng != null;
            const canPhoto = stage === 'on_the_way' || stage === 'analyzing';

            const bars = INSP_STEPS.map((s, i) => `<i class="${i < idx || stage === 'completed' ? 'done' : (i === idx ? 'now' : '')}"></i>`).join('');
            const labels = INSP_STEPS.map((s, i) => `<span class="${i === idx ? 'on' : ''}">${INSP_LABELS[s]}</span>`).join('');

            const thumbs = photos.map((p) => `
                <div class="insp-photo">
                    <img data-insp-photo="${escapeHtml(p)}" alt="Inspection photo" src="${escapeHtml(inspPhotoUrls[p] || '')}" onclick="openInspPhoto(this.dataset.inspPhoto)">
                    ${canPhoto ? `<button title="Remove" onclick="removeInspPhoto('${escapeHtml(key)}', this.parentElement.querySelector('img').dataset.inspPhoto)">✕</button>` : ''}
                </div>`).join('');
            const addTile = canPhoto ? `
                <label class="insp-add">＋<br>TAP HERE<br>ADD PHOTO
                    <input type="file" accept="image/*" multiple onchange="uploadInspPhotos('${escapeHtml(key)}', this)">
                </label>` : '';

            let action = '';
            if (stage === 'assigned') {
                action = `<button class="insp-action" onclick="inspStep('${escapeHtml(key)}', 'on_the_way')">🚗 I'M ON THE WAY</button>`;
            } else if (stage === 'on_the_way') {
                action = `<button class="insp-action" onclick="inspStep('${escapeHtml(key)}', 'analyzing')">🔍 START ANALYZING</button>
                          <div class="insp-note">Tap when you reach the car and start checking it.</div>`;
            } else if (stage === 'analyzing') {
                action = `<button class="insp-action green" ${photos.length ? '' : 'disabled'} onclick="inspStep('${escapeHtml(key)}', 'completed')">✅ MARK COMPLETED</button>
                          <div class="insp-note">${photos.length ? `${photos.length} photo${photos.length === 1 ? '' : 's'} added — the customer will see them.` : 'Add at least 1 photo first.'}</div>`;
            } else if (stage === 'completed') {
                action = `<div class="insp-done">✔ Inspection completed${b.inspectionCompletedAt ? ` · ${escapeHtml(formatFullDateTime(b.inspectionCompletedAt))}` : ''}</div>`;
            }

            return `
                <div class="booking-card insp-card">
                    <div class="insp-tag">🔍 INSPECTION VISIT</div>
                    <div class="booking-header">
                        <div>
                            <div class="booking-title">${escapeHtml(title)}</div>
                            <div class="booking-type">Visit the customer — no pickup</div>
                        </div>
                        <div>
                            ${b.price ? `<div class="booking-price">${escapeHtml(String(b.price))}</div>` : ''}
                            ${b.isCod ? `<div class="cod-pill">💰 Collect payment</div>` : ''}
                        </div>
                    </div>
                    ${renderSlotBanner(b)}
                    <div class="booking-detail-row"><strong>Location${b.pickupAddressName ? ` (${escapeHtml(b.pickupAddressName)})` : ''}:</strong> ${escapeHtml(b.pickupAddress || 'Not specified')}</div>
                    ${b.vehicleCondition ? `<div class="booking-detail-row"><strong>Vehicle:</strong> ${escapeHtml(b.vehicleCondition)} ${escapeHtml(b.vehicleType || '')}</div>` : ''}
                    ${renderCustomerContactRow(b)}
                    <div class="booking-footer">
                        <span></span>
                        ${hasLoc
                            ? `<a class="navigate-btn" href="${navigateUrl(b.pickupLat, b.pickupLng)}" target="_blank" rel="noopener">🧭 Navigate</a>`
                            : `<span class="navigate-btn disabled">🧭 No location</span>`}
                    </div>
                    <div class="insp-steps">${bars}</div>
                    <div class="insp-step-labels">${labels}</div>
                    ${photos.length || canPhoto ? `
                        <div class="booking-detail-row" style="margin-top:14px"><strong>Photos (${photos.length})</strong></div>
                        <div class="insp-photos">${thumbs}${addTile}</div>` : ''}
                    ${action}
                </div>
            `;
        }

        // Fills in photo thumbnails after each render (signed links, 10 min).
        async function loadInspPhotoUrls() {
            const missing = [...document.querySelectorAll('img[data-insp-photo]')]
                .map((img) => img.dataset.inspPhoto)
                .filter((p) => p && !inspPhotoUrls[p]);
            if (missing.length) {
                const { data } = await sbClient.storage.from('inspection-photos').createSignedUrls([...new Set(missing)], 600);
                (data || []).forEach((d) => { if (d.path && d.signedUrl) inspPhotoUrls[d.path] = d.signedUrl; });
            }
            document.querySelectorAll('img[data-insp-photo]').forEach((img) => {
                const url = inspPhotoUrls[img.dataset.inspPhoto];
                if (url && img.getAttribute('src') !== url) img.src = url;
            });
        }

        function openInspPhoto(path) {
            const url = inspPhotoUrls[path];
            if (url) window.open(url, '_blank', 'noopener');
        }

        async function inspStep(key, step) {
            const b = bookingsIndex[key];
            if (!b || inspBusy) return;
            if (step === 'completed' && b.isCod &&
                !confirm(`Confirm you have collected ${b.price || 'the cash payment'} from the customer.`)) return;
            inspBusy = true;
            try {
                const { error } = await sbClient.rpc('delivery_inspection_step', {
                    p_table: b.sourceTable, p_id: String(b.id), p_step: step,
                });
                if (error) { alert(error.message); return; }
                if (step === 'completed') await incrementDeliveriesCompleted();
                await fetchAssignedBookings(currentPartnerId);
            } finally {
                inspBusy = false;
            }
        }

        // Shrinks a photo in the browser before upload (max 1600px JPEG).
        function inspImageToJpeg(file, max = 1600) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const k = Math.min(1, max / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url);
                    c.toBlob((blob) => blob ? resolve(blob) : reject(new Error("Couldn't read that photo.")), 'image/jpeg', 0.82);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't read that photo.")); };
                img.src = url;
            });
        }

        async function uploadInspPhotos(key, input) {
            const b = bookingsIndex[key];
            const files = [...(input.files || [])];
            if (!b || !files.length) return;
            const label = input.parentElement;
            label.style.opacity = '0.5';
            label.firstChild.textContent = 'Uploading…';
            try {
                for (const file of files) {
                    const blob = await inspImageToJpeg(file);
                    const rand = Math.random().toString(36).slice(2, 10);
                    const path = `${b.sourceTable}/${b.id}/${Date.now()}-${rand}.jpg`;
                    const up = await sbClient.storage.from('inspection-photos').upload(path, blob, { contentType: 'image/jpeg' });
                    if (up.error) throw up.error;
                    const { error } = await sbClient.rpc('delivery_inspection_photo', {
                        p_table: b.sourceTable, p_id: String(b.id), p_path: path,
                    });
                    if (error) throw error;
                }
            } catch (e) {
                alert('Photo upload failed: ' + (e.message || e));
            }
            await fetchAssignedBookings(currentPartnerId);
        }

        async function removeInspPhoto(key, path) {
            const b = bookingsIndex[key];
            if (!b || !path || !confirm('Remove this photo?')) return;
            const { error } = await sbClient.rpc('delivery_inspection_photo', {
                p_table: b.sourceTable, p_id: String(b.id), p_path: path, p_remove: true,
            });
            if (error) { alert(error.message); return; }
            await fetchAssignedBookings(currentPartnerId);
        }

        // ── Fleet pickups (21-point inspection) ─────────────────────────
        // Only fleet trips have the 21 photos. Trips come from
        // delivery_fleet_trips() (supabase/fleet_inspection.sql). Photo 21
        // starts the report (fleet-inspection function).
        const FLEET_SHOTS = [
            ['Front', 'Stand 3 big steps in front of the vehicle, in the middle. Fit the whole front, including the number plate.'],
            ['Front-left corner', 'Stand at the front-left corner, 2 big steps away. Fit the front and the left side in one photo.'],
            ['Left side', 'Stand in the middle of the left side, far enough back to fit the whole side, front to back.'],
            ['Rear-left corner', 'Stand at the rear-left corner, 2 big steps away. Fit the back and the left side in one photo.'],
            ['Rear', 'Stand 3 big steps behind the vehicle, in the middle. Fit the whole back, including the number plate.'],
            ['Rear-right corner', 'Stand at the rear-right corner, 2 big steps away. Fit the back and the right side in one photo.'],
            ['Right side', 'Stand in the middle of the right side, far enough back to fit the whole side, front to back.'],
            ['Front-right corner', 'Stand at the front-right corner, 2 big steps away. Fit the front and the right side in one photo.'],
            ['Bonnet / hood', 'Stand at the front and hold the phone high, pointing down at the bonnet. Show the whole bonnet.'],
            ['Roof', 'Hold the phone up high (or stand on a step) so the roof is visible. Show as much of the roof as you can.'],
            ['Windscreen', 'Stand at the front and photograph the whole front glass. Avoid your reflection; look for cracks and chips.'],
            ['Rear glass', 'Photograph the whole back glass (or the back of the cabin for pickup trucks).'],
            ['Front bumper (close-up)', 'Go close (1 step) and photograph the front bumper from left end to right end.'],
            ['Rear bumper (close-up)', 'Go close (1 step) and photograph the rear bumper from left end to right end.'],
            ['Front-left wheel & tyre', 'Crouch and photograph the front-left wheel. Show the whole tyre and the rim.'],
            ['Rear-left wheel & tyre', 'Crouch and photograph the rear-left wheel. Show the whole tyre and the rim.'],
            ['Rear-right wheel & tyre', 'Crouch and photograph the rear-right wheel. Show the whole tyre and the rim.'],
            ['Front-right wheel & tyre', 'Crouch and photograph the front-right wheel. Show the whole tyre and the rim.'],
            ['Dashboard & odometer', 'Turn the ignition on. Photograph the dashboard so the km reading, fuel level and any warning lights are clear.'],
            ['Front seats', 'Open the driver door and photograph both front seats and the floor.'],
            ['Rear seats / cargo area', 'Photograph the back seats, or the cargo area / loading bed for goods vehicles.'],
        ];
        let fleetTrips = [];
        let fleetGarages = {};
        const fleetSel = {};            // trip id → photo number being taken
        const fleetUrls = {};           // storage path → signed link

        async function fetchFleetTrips() {
            const card = document.getElementById('fleetCard');
            try {
                const { data, error } = await sbClient.rpc('delivery_fleet_trips');
                if (error) throw error;
                fleetTrips = data || [];
                const ids = [...new Set(fleetTrips.map((t) => t.assigned_to_admin_id).filter(Boolean))];
                if (ids.length) {
                    const { data: g } = await sbClient.from('admin').select('id, username, latitude, longitude, address').in('id', ids);
                    fleetGarages = {};
                    (g || []).forEach((x) => { fleetGarages[String(x.id)] = x; });
                }
                // Signed links for the photos already taken (thumbnails).
                const paths = fleetTrips.flatMap((t) => Object.values(t.inspection21_photos || {})).filter((p) => !fleetUrls[p]);
                if (paths.length) {
                    const { data: links } = await sbClient.storage.from('fleet-inspections').createSignedUrls(paths, 3600);
                    (links || []).forEach((l) => { if (l.signedUrl) fleetUrls[l.path] = l.signedUrl; });
                }
                renderFleetTrips();
            } catch (err) {
                // Never break the rest of the dashboard over this section.
                console.warn('Fleet trips not loaded:', err.message || err);
                if (card) card.style.display = 'none';
            }
        }

        function renderFleetTrips() {
            const card = document.getElementById('fleetCard');
            const box = document.getElementById('fleetContent');
            if (!card || !box) return;
            // Open trips first, then the 5 most recent finished ones.
            const open = fleetTrips.filter((t) => t.delivery_stage !== 'at_garage');
            const done = fleetTrips.filter((t) => t.delivery_stage === 'at_garage').slice(0, 5);
            const list = [...open, ...done];
            card.style.display = list.length ? '' : 'none';
            box.innerHTML = list.map(fleetCardHtml).join('');
        }

        function fleetCardHtml(t) {
            const id = escapeHtml(String(t.id));
            const photos = t.inspection21_photos || {};
            const have = Object.keys(photos).length;
            const stage = t.delivery_stage || 'assigned';
            const plate = escapeHtml(fleetPlate(t.car_number));
            const garage = fleetGarages[String(t.assigned_to_admin_id || '')];
            const top = `
                <span class="fleet-tag">🚚 FLEET PICKUP</span>
                <div class="fleet-co">${escapeHtml(t.company_name || t.username || 'Fleet')}</div>
                <div class="fleet-model">${escapeHtml(t.vehicle_model || 'Vehicle')}</div>
                ${plate ? `<span class="fleet-plate"><i>IND</i><b>${plate}</b></span>` : ''}`;

            if (stage === 'at_garage') {
                return `<div class="fleet-card done">${top}
                    <div class="fleet-done">✅ Dropped at the garage${t.stage_at_garage_at ? ' · ' + escapeHtml(formatFullDateTime(t.stage_at_garage_at)) : ''}</div></div>`;
            }

            if (stage === 'picked_up') {
                const nav = garage && garage.latitude && garage.longitude
                    ? `<a class="fleet-btn blue" style="text-align:center;line-height:62px;text-decoration:none" target="_blank" rel="noopener" href="${navigateUrl(garage.latitude, garage.longitude)}">🧭 NAVIGATE TO GARAGE</a>` : '';
                return `<div class="fleet-card">${top}
                    <div class="fleet-info">✅ 21 photos done · picked up${t.stage_picked_up_at ? ' ' + escapeHtml(formatFullDateTime(t.stage_picked_up_at)) : ''}</div>
                    <div class="fleet-info">🏪 Garage: <b>${escapeHtml(garage ? garage.username : 'Not set yet — call Reperi')}</b>${garage && garage.address ? '<br>' + escapeHtml(garage.address) : ''}</div>
                    ${nav}
                    <button class="fleet-btn green" onclick="fleetStep('${id}','at_garage')">🏁 DROPPED AT GARAGE</button>
                    <div class="fleet-msg" id="fleet-msg-${id}"></div></div>`;
            }

            // Taking the 21 photos.
            const firstMissing = FLEET_SHOTS.findIndex((_, i) => !photos[String(i + 1)]) + 1;
            const sel = fleetSel[t.id] || firstMissing || 21;
            const [area, how] = FLEET_SHOTS[sel - 1];
            const path = photos[String(sel)];
            const url = path ? fleetUrls[path] : null;
            const grid = FLEET_SHOTS.map((_, i) => {
                const n = i + 1;
                const cls = n === sel ? 'cur' : (photos[String(n)] ? 'ok' : '');
                return `<button class="${cls}" title="${escapeHtml(FLEET_SHOTS[i][0])}" onclick="fleetPick('${id}', ${n})">${n}</button>`;
            }).join('');
            return `<div class="fleet-card">${top}
                <div class="fleet-prog">📷 ${have} of 21 photos</div>
                <div class="fleet-bar"><div style="width:${Math.round(have / 21 * 100)}%"></div></div>
                <div class="fleet-now"><b>Photo ${sel} · ${escapeHtml(area)}</b><span>${escapeHtml(how)}</span></div>
                <label class="fleet-shot" id="fleet-shot-${id}">
                    ${url ? `<img src="${escapeHtml(url)}" alt="Photo ${sel}"><span class="over">✅ Done — tap to retake photo ${sel}</span>`
                          : `<span class="ic">📷</span>TAP — TAKE PHOTO ${sel}<small>camera or gallery</small>`}
                    <input type="file" accept="image/*" hidden onchange="fleetUpload('${id}', ${sel}, this)">
                </label>
                <div class="fleet-grid">${grid}</div>
                <button class="fleet-btn green" ${have >= 21 ? '' : 'disabled'} onclick="fleetStep('${id}','picked_up')">✅ VEHICLE PICKED UP</button>
                <div class="fleet-hint">${have >= 21 ? 'All 21 photos taken — the inspection report is being made.' : `Unlocks after all 21 photos (${21 - have} to go)`}</div>
                <div class="fleet-msg" id="fleet-msg-${id}"></div></div>`;
        }

        // "KA51MH2210" → "KA 51 MH 2210" (anything else just in capitals).
        function fleetPlate(raw) {
            const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            const m = s.match(/^([A-Z]{2})(\d{1,2})([A-Z]{0,3})(\d{1,4})$/);
            return m ? [m[1], m[2], m[3], m[4]].filter(Boolean).join(' ') : String(raw || '').toUpperCase();
        }

        function fleetPick(id, n) {
            fleetSel[id] = n;
            renderFleetTrips();
        }

        async function fleetUpload(id, n, input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const shot = document.getElementById('fleet-shot-' + id);
            if (shot) shot.innerHTML = '<div class="loading-spinner"></div><span>UPLOADING PHOTO ' + n + '…</span>';
            try {
                const blob = await inspImageToJpeg(file);
                const path = `${id}/${n}-${Date.now()}.jpg`;
                const up = await sbClient.storage.from('fleet-inspections').upload(path, blob, { contentType: 'image/jpeg' });
                if (up.error) throw up.error;
                const { data, error } = await sbClient.rpc('delivery_fleet_photo', { p_id: String(id), p_n: n, p_path: path });
                if (error) throw error;
                fleetUrls[path] = URL.createObjectURL(blob);
                const trip = fleetTrips.find((t) => String(t.id) === String(id));
                if (trip) trip.inspection21_photos = data || trip.inspection21_photos;
                // Jump to the next photo still missing.
                const photos = (trip && trip.inspection21_photos) || {};
                const next = FLEET_SHOTS.findIndex((_, i) => !photos[String(i + 1)]) + 1;
                fleetSel[id] = next || n;
                renderFleetTrips();
            } catch (e) {
                alert('Photo upload failed: ' + (e.message || e));
                await fetchFleetTrips();
            }
        }

        async function fleetStep(id, step) {
            const ask = step === 'picked_up'
                ? 'Vehicle picked up with all 21 photos taken?'
                : 'Vehicle dropped at the garage?';
            if (!confirm(ask)) return;
            const msg = document.getElementById('fleet-msg-' + id);
            try {
                const { error } = await sbClient.rpc('delivery_fleet_step', { p_id: String(id), p_step: step });
                if (error) throw error;
                if (step === 'at_garage') await incrementDeliveriesCompleted();
                await fetchFleetTrips();
            } catch (e) {
                if (msg) { msg.style.color = '#fca5a5'; msg.textContent = '❌ ' + (e.message || 'Could not save'); }
            }
        }

        async function handleLogout() {
            oneSignalLogout();
            await sbClient.auth.signOut();
            window.location.href = 'delivery.html';
        }
    </script>
</body>
</html>
