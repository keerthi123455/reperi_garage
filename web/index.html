<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Phone layout from the very first moment. Without this, phones draw the
       page at desktop width (zoomed out) until Flutter adds its own tag. These
       are the same values Flutter uses, so nothing jumps when it takes over. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Reperi — premium vehicle care and garage services.">

  <!-- Speed: open connections early to the servers the app needs on start-up
       (Flutter's renderer CDN, Google Fonts for Manrope, and Supabase), so
       they're ready when asked for. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://rmvxqjyoqfinbrpubsvp.supabase.co" crossorigin>

  <!-- Speed: start downloading the app itself (main.dart.js, the biggest file)
       immediately, in parallel with flutter_bootstrap.js, instead of waiting
       for the bootstrap to ask for it. -->
  <link rel="preload" href="main.dart.js" as="script">

  <!-- Speed: Razorpay is only used when the user taps Pay, so it downloads in
       the background ("defer") instead of blocking the app from starting. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "6bc39a67-c05a-4ba4-b950-9ccfc8e9b9b6",
        safari_web_id: "web.onesignal.auto.195e7e66-9dea-4e11-b56c-b4a654da5ab7",
        notifyButton: {
          enable: true,
        },
        allowLocalhostAsSecureOrigin: true,
      });
    });
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Reperi">
  <!-- "?v=2" makes phones/browsers fetch the NEW wrench icon instead of the
       old cached one. Bump the number if you ever change the icon again. -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon (browser tab icon) -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Reperi</title>
  <link rel="manifest" href="manifest.json">

  <!-- ===================================================================
       LOADING ANIMATION (shown while the app downloads)
       A car drives in, a mechanic washes it, then pops the hood and services
       it, on a loop, with a cheeky line that changes every 0.8 s. When the
       app is ready the car drives off and Reperi's own splash screen appears.
       Pure HTML/SVG/CSS: no downloads, only GPU-friendly animations.
       =================================================================== -->
  <style>
    html, body { margin: 0; background: #f7c741; }

    #reperi-loader {
      --navy: #142a6e;
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(120% 80% at 50% 40%, #fbd35a 0%, #f7c741 45%, #e9b12e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--navy);
      transition: opacity .35s ease;
      -webkit-font-smoothing: antialiased;
    }
    #reperi-loader.fade { opacity: 0; }

    #reperi-loader .spanner {
      width: 46px; height: 46px; margin-bottom: 10px; display: block;
      transform-origin: 50% 50%;
      animation: rp-spanner 2.4s cubic-bezier(.45, 0, .2, 1) infinite;
    }
    @keyframes rp-spanner {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-18deg); }
      60% { transform: rotate(6deg); }
    }
    #reperi-loader .brand {
      font-weight: 800; letter-spacing: .32em; font-size: 15px;
      margin: 0 0 14px .32em; opacity: .9;
    }
    /* Fills phones edge-to-edge, grows on laptops, and never gets taller than
       the screen (phones held sideways). */
    #reperi-loader svg {
      width: min(88vw, 540px, calc((100vh - 170px) * 1.8));
      width: min(88vw, 540px, calc((100dvh - 170px) * 1.8));
      height: auto; overflow: visible; display: block;
    }
    @media (min-width: 900px) {
      #reperi-loader .spanner { width: 54px; height: 54px; }
      #reperi-loader .brand { font-size: 17px; margin-bottom: 18px; }
      #reperi-loader .msg { font-size: 17px; max-width: 460px; }
      #reperi-loader .bar { width: 150px; }
    }
    #reperi-loader svg * { transform-box: view-box; }

    #reperi-loader .msg {
      height: 44px; margin-top: 18px; padding: 0 24px; max-width: 340px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: 15px; font-weight: 600; line-height: 1.35;
      transition: opacity .2s ease, transform .2s ease;
    }
    #reperi-loader .msg.out { opacity: 0; transform: translateY(-6px); }

    #reperi-loader .bar {
      position: relative; width: 120px; height: 3px; margin-top: 14px;
      border-radius: 3px; overflow: hidden; background: rgba(20, 42, 110, .14);
    }
    #reperi-loader .bar::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%;
      border-radius: 3px; background: var(--navy);
      animation: rp-slide 1.1s cubic-bezier(.65, 0, .35, 1) infinite;
    }
    @keyframes rp-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

    /* ---- Car: drives in, idles, drives off ---- */
    #rp-car { animation: rp-drive-in 1.1s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes rp-drive-in { from { transform: translateX(-360px); } to { transform: translateX(0); } }
    #rp-car-body { animation: rp-idle 1.6s ease-in-out 1.1s infinite; }
    @keyframes rp-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }

    .rp-wheel { animation: rp-wheel-in 1.1s cubic-bezier(.16, 1, .3, 1) both; }
    #rp-wheel-r { transform-origin: 95px 166px; }
    #rp-wheel-f { transform-origin: 195px 166px; }
    @keyframes rp-wheel-in { from { transform: rotate(-900deg); } to { transform: rotate(0deg); } }

    #rp-shadow { transform-origin: 152px 183px; animation: rp-shadow-in 1.1s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes rp-shadow-in { from { transform: translateX(-360px); } to { transform: translateX(0); } }

    #rp-glint { animation: rp-glint 3.2s ease-in-out 1.4s infinite; transform: translateX(-140px); }
    @keyframes rp-glint { 0% { transform: translateX(-140px); } 35%, 100% { transform: translateX(260px); } }

    /* Leaving: car zooms off to the right */
    #reperi-loader.leaving #rp-car,
    #reperi-loader.leaving #rp-shadow { animation: rp-drive-out .55s cubic-bezier(.55, 0, .9, .4) forwards; }
    #reperi-loader.leaving .rp-wheel { animation: rp-wheel-out .55s cubic-bezier(.55, 0, .9, .4) forwards; }
    @keyframes rp-drive-out { from { transform: translateX(0); } to { transform: translateX(420px); } }
    @keyframes rp-wheel-out { from { transform: rotate(0); } to { transform: rotate(900deg); } }

    /* ---- 6.4 s work cycle: wash (first half) then service (second half) ---- */
    #rp-wash    { animation: rp-phase-a 6.4s ease-in-out 1.1s infinite both; }
    #rp-service { animation: rp-phase-b 6.4s ease-in-out 1.1s infinite both; }
    @keyframes rp-phase-a { 0% { opacity: 0; } 6%, 44% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes rp-phase-b { 0%, 48% { opacity: 0; } 54%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }

    /* Mechanic's arm: points the hose at the car, then reaches into the engine */
    #rp-arm { transform-origin: 268px 103px; animation: rp-arm 6.4s cubic-bezier(.45, 0, .2, 1) 1.1s infinite both; }
    @keyframes rp-arm {
      0%, 44% { transform: rotate(12deg); }
      52%, 92% { transform: rotate(-36deg); }
      100% { transform: rotate(12deg); }
    }
    #rp-wand   { transform-origin: 239px 103px; animation: rp-jiggle .45s ease-in-out infinite alternate; }
    @keyframes rp-jiggle { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
    #rp-wrench { transform-origin: 239px 103px; animation: rp-turn .5s ease-in-out infinite alternate; }
    @keyframes rp-turn { from { transform: rotate(-35deg); } to { transform: rotate(25deg); } }

    /* Head nods along while working */
    #rp-head { transform-origin: 276px 94px; animation: rp-nod 1.6s ease-in-out infinite; }
    @keyframes rp-nod { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }

    /* Hood pops open for the service half */
    #rp-hood { transform-origin: 218px 122px; animation: rp-hood 6.4s cubic-bezier(.45, 0, .2, 1) 1.1s infinite both; }
    @keyframes rp-hood {
      0%, 46% { transform: rotate(0); }
      54%, 90% { transform: rotate(-34deg); }
      97%, 100% { transform: rotate(0); }
    }

    /* Water spray: droplets fly from the nozzle onto the car */
    .rp-drop { animation: rp-drop .7s cubic-bezier(.3, .6, .5, 1) infinite; opacity: 0; }
    .rp-drop:nth-child(2) { animation-delay: .12s; }
    .rp-drop:nth-child(3) { animation-delay: .24s; }
    .rp-drop:nth-child(4) { animation-delay: .36s; }
    .rp-drop:nth-child(5) { animation-delay: .48s; }
    .rp-drop:nth-child(6) { animation-delay: .58s; }
    @keyframes rp-drop {
      0% { opacity: 0; transform: translate(0, 0) scale(.6); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
    }

    /* Foam bubbles grow on the car and float up */
    .rp-bub { animation: rp-bub 2.2s ease-in-out infinite; opacity: 0; transform-origin: var(--o); }
    .rp-bub:nth-child(2) { animation-delay: .3s; }
    .rp-bub:nth-child(3) { animation-delay: .7s; }
    .rp-bub:nth-child(4) { animation-delay: 1s; }
    .rp-bub:nth-child(5) { animation-delay: 1.3s; }
    .rp-bub:nth-child(6) { animation-delay: 1.6s; }
    .rp-bub:nth-child(7) { animation-delay: .5s; }
    @keyframes rp-bub {
      0% { opacity: 0; transform: translateY(0) scale(.2); }
      25% { opacity: .95; transform: translateY(-2px) scale(1); }
      100% { opacity: 0; transform: translateY(-22px) scale(1.15); }
    }

    /* Sparks from the engine bay */
    .rp-spark { animation: rp-spark .6s ease-out infinite; opacity: 0; transform-origin: 238px 124px; }
    .rp-spark:nth-child(2) { animation-delay: .15s; }
    .rp-spark:nth-child(3) { animation-delay: .3s; }
    .rp-spark:nth-child(4) { animation-delay: .45s; }
    @keyframes rp-spark {
      0% { opacity: 0; transform: translate(0, 0) scale(.4); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
    }

    /* Puddle under the car while washing */
    #rp-puddle { transform-origin: 152px 184px; }

    @media (prefers-reduced-motion: reduce) {
      #reperi-loader *, #reperi-loader *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div id="reperi-loader" role="status" aria-live="polite">
    <svg class="spanner" viewBox="0 0 40 40" aria-hidden="true">
      <defs>
        <mask id="rp-spanner-cut">
          <g transform="rotate(45 20 20)">
            <circle cx="20" cy="9" r="8.5" fill="#fff"/>
            <rect x="16.6" y="12" width="6.8" height="22" rx="3.4" fill="#fff"/>
            <circle cx="20" cy="33" r="4.6" fill="#fff"/>
            <rect x="16.8" y="-1" width="6.4" height="9" rx="1" fill="#000"/>
            <circle cx="20" cy="33" r="2" fill="#000"/>
            <rect x="19" y="16" width="2" height="12" rx="1" fill="#000" opacity=".35"/>
          </g>
        </mask>
      </defs>
      <rect width="40" height="40" fill="#142a6e" mask="url(#rp-spanner-cut)"/>
    </svg>
    <div class="brand">REPERI</div>

    <svg viewBox="0 0 360 200" aria-hidden="true">
      <defs>
        <clipPath id="rp-body-clip">
          <path d="M52 160V140q2-12 16-14l30-4 24-22q6-5 16-5h44q10 0 18 8l18 19 20 4q12 3 14 16v18q0 6-6 6h-32a19 19 0 0 0-38 0h-62a19 19 0 0 0-38 0H58q-6 0-6-6z"/>
        </clipPath>
        <linearGradient id="rp-glass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8f1ff"/>
          <stop offset="1" stop-color="#9fb8e6"/>
        </linearGradient>
        <linearGradient id="rp-paint" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a45a0"/>
          <stop offset="1" stop-color="#142a6e"/>
        </linearGradient>
      </defs>

      <!-- floor -->
      <rect x="10" y="183" width="340" height="2" rx="1" fill="#142a6e" opacity=".12"/>

      <!-- puddle (wash half only) -->
      <g id="rp-wash-puddle-wrap">
        <ellipse id="rp-puddle" cx="152" cy="186" rx="118" ry="6" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0;.35;.35;0;0" keyTimes="0;.08;.44;.52;1" dur="6.4s" begin="1.1s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- car shadow -->
      <ellipse id="rp-shadow" cx="152" cy="183" rx="104" ry="5" fill="#142a6e" opacity=".22"/>

      <!-- ===== CAR ===== -->
      <g id="rp-car">
        <g id="rp-car-body">
          <!-- engine bay (seen when the hood opens) -->
          <path d="M218 122l20 4q10 2 12 7l-32-5z" fill="#0b1437"/>
          <rect x="226" y="122" width="12" height="5" rx="1.5" fill="#56627f"/>

          <!-- body -->
          <path d="M52 160V140q2-12 16-14l30-4 24-22q6-5 16-5h44q10 0 18 8l18 19 20 4q12 3 14 16v18q0 6-6 6h-32a19 19 0 0 0-38 0h-62a19 19 0 0 0-38 0H58q-6 0-6-6z" fill="url(#rp-paint)"/>

          <!-- dark wheel arches (so no background peeks around the tyres) -->
          <path d="M76 166a19 19 0 0 1 38 0z" fill="#0b1437"/>
          <path d="M176 166a19 19 0 0 1 38 0z" fill="#0b1437"/>

          <!-- windows -->
          <path d="M108 122l20-19q4-3 10-3h14v22z" fill="url(#rp-glass)"/>
          <path d="M158 100h22q8 0 14 6l16 16h-52z" fill="url(#rp-glass)"/>

          <!-- side details -->
          <path d="M60 140h186" stroke="#3b58b8" stroke-width="1.5" opacity=".7"/>
          <path d="M155 124v38" stroke="#0e1f55" stroke-width="1.2" opacity=".8"/>
          <rect x="132" y="130" width="12" height="2.6" rx="1.3" fill="#c9d4f2"/>
          <rect x="170" y="130" width="12" height="2.6" rx="1.3" fill="#c9d4f2"/>
          <!-- lights -->
          <path d="M244 132h7q1 4 1 7h-8z" fill="#ffd54f"/>
          <path d="M52 134h6v7h-6z" fill="#ef5b4c"/>

          <!-- moving shine across the paint -->
          <g clip-path="url(#rp-body-clip)">
            <rect id="rp-glint" x="40" y="80" width="26" height="110" fill="#ffffff" opacity=".22" transform="skewX(-20)"/>
          </g>

          <!-- hood (pops open) -->
          <path id="rp-hood" d="M218 122l20 4q11 2.5 13 7l-33-5z" fill="#2a45a0"/>

          <!-- foam bubbles (wash) -->
          <g id="rp-wash">
            <g>
              <circle class="rp-bub" style="--o:120px 140px" cx="120" cy="140" r="6" fill="#fff" fill-opacity=".85"/>
              <circle class="rp-bub" style="--o:150px 150px" cx="150" cy="150" r="4.5" fill="#fff" fill-opacity=".85"/>
              <circle class="rp-bub" style="--o:182px 138px" cx="182" cy="138" r="7" fill="#fff" fill-opacity=".85"/>
              <circle class="rp-bub" style="--o:90px 146px" cx="90" cy="146" r="5" fill="#fff" fill-opacity=".85"/>
              <circle class="rp-bub" style="--o:210px 148px" cx="210" cy="148" r="4" fill="#fff" fill-opacity=".85"/>
              <circle class="rp-bub" style="--o:136px 112px" cx="136" cy="112" r="4" fill="#fff" fill-opacity=".85"/>
              <circle class="rp-bub" style="--o:70px 150px" cx="70" cy="150" r="3.5" fill="#fff" fill-opacity=".85"/>
            </g>
          </g>
        </g>

        <!-- wheels -->
        <g id="rp-wheel-r" class="rp-wheel">
          <circle cx="95" cy="166" r="17" fill="#141414"/>
          <circle cx="95" cy="166" r="9" fill="#c7ccd8"/>
          <path d="M95 158v16M87 166h16M89.3 160.3l11.4 11.4M100.7 160.3l-11.4 11.4" stroke="#7d8496" stroke-width="2"/>
          <circle cx="95" cy="166" r="2.5" fill="#4b5263"/>
        </g>
        <g id="rp-wheel-f" class="rp-wheel">
          <circle cx="195" cy="166" r="17" fill="#141414"/>
          <circle cx="195" cy="166" r="9" fill="#c7ccd8"/>
          <path d="M195 158v16M187 166h16M189.3 160.3l11.4 11.4M200.7 160.3l-11.4 11.4" stroke="#7d8496" stroke-width="2"/>
          <circle cx="195" cy="166" r="2.5" fill="#4b5263"/>
        </g>
      </g>

      <!-- ===== MECHANIC ===== -->
      <g id="rp-guy">
        <!-- legs & boots -->
        <rect x="267" y="134" width="9" height="44" rx="4" fill="#142a6e"/>
        <rect x="278" y="134" width="9" height="44" rx="4" fill="#142a6e"/>
        <ellipse cx="270" cy="180" rx="8" ry="3.5" fill="#1a1a1a"/>
        <ellipse cx="282" cy="180" rx="7" ry="3.5" fill="#1a1a1a"/>
        <!-- body: white tee + navy overall bib -->
        <rect x="264" y="98" width="26" height="42" rx="9" fill="#ffffff"/>
        <path d="M266 118h22v20q0 4-4 4h-14q-4 0-4-4z" fill="#142a6e"/>
        <rect x="270" y="124" width="14" height="6" rx="2" fill="#ef5b4c"/>
        <!-- head -->
        <g id="rp-head">
          <rect x="273" y="90" width="7" height="8" rx="3" fill="#b9784a"/>
          <circle cx="276" cy="83" r="10" fill="#b9784a"/>
          <circle cx="270" cy="83" r="1.3" fill="#1a1a1a"/>
          <path d="M268 88q3 2 6 0" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          <!-- cap with brim facing the car -->
          <path d="M266 80q0-11 10-11t10 9z" fill="#ef5b4c"/>
          <path d="M268 79h-9q-2 0-1-2l4-2h8z" fill="#c9443a"/>
        </g>
        <!-- arm + tools (rotates between hose pose and engine pose) -->
        <g id="rp-arm">
          <path d="M268 103h-14" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
          <path d="M256 103h-15" stroke="#b9784a" stroke-width="6" stroke-linecap="round"/>
          <!-- pressure wand (wash) -->
          <g id="rp-wand-wrap" class="rp-tool-wash">
            <g id="rp-wand">
              <path d="M240 103h-17" stroke="#8e97ab" stroke-width="3.2" stroke-linecap="round"/>
              <rect x="219" y="100.5" width="6" height="5" rx="1.2" fill="#ef5b4c"/>
              <!-- spray -->
              <g>
                <ellipse class="rp-drop" style="--dx:-46px;--dy:20px" cx="218" cy="103" rx="2.6" ry="1.4" fill="#ffffff"/>
                <ellipse class="rp-drop" style="--dx:-62px;--dy:10px" cx="218" cy="103" rx="2.2" ry="1.2" fill="#e6f3ff"/>
                <ellipse class="rp-drop" style="--dx:-38px;--dy:30px" cx="218" cy="103" rx="2.6" ry="1.4" fill="#ffffff"/>
                <ellipse class="rp-drop" style="--dx:-70px;--dy:24px" cx="218" cy="103" rx="2" ry="1.1" fill="#e6f3ff"/>
                <ellipse class="rp-drop" style="--dx:-52px;--dy:36px" cx="218" cy="103" rx="2.4" ry="1.3" fill="#ffffff"/>
                <ellipse class="rp-drop" style="--dx:-30px;--dy:14px" cx="218" cy="103" rx="2" ry="1.1" fill="#e6f3ff"/>
              </g>
            </g>
          </g>
          <!-- wrench (service) -->
          <g class="rp-tool-service">
            <g id="rp-wrench">
              <path d="M239 103h-15" stroke="#c7ccd8" stroke-width="3.4" stroke-linecap="round"/>
              <path d="M226 98.5a5 5 0 1 0 0 9l-1.6-2.6h-2.4l-1-1.4 1-1.4h2.4z" fill="#c7ccd8"/>
            </g>
          </g>
          <circle cx="240" cy="103" r="3.6" fill="#b9784a"/>
        </g>
      </g>

      <!-- sparks from the engine (service) -->
      <g id="rp-service">
        <g>
          <path class="rp-spark" style="--dx:-10px;--dy:-14px" d="M238 124l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z" fill="#fff4c2"/>
          <path class="rp-spark" style="--dx:6px;--dy:-16px" d="M238 124l1 2.3 2.3 1-2.3 1-1 2.3-1-2.3-2.3-1 2.3-1z" fill="#ffffff"/>
          <path class="rp-spark" style="--dx:-16px;--dy:-6px" d="M238 124l1 2.3 2.3 1-2.3 1-1 2.3-1-2.3-2.3-1 2.3-1z" fill="#fff4c2"/>
          <path class="rp-spark" style="--dx:2px;--dy:-20px" d="M238 124l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z" fill="#ffffff"/>
        </g>
      </g>
    </svg>

    <div class="msg" id="rp-msg">Loading… getting the car wash done, mate. Hold up…</div>
    <div class="bar"></div>
  </div>

  <style>
    /* The wand shows during the wash half, the wrench during the service half */
    #reperi-loader .rp-tool-wash    { animation: rp-phase-a 6.4s ease-in-out 1.1s infinite both; }
    #reperi-loader .rp-tool-service { animation: rp-phase-b 6.4s ease-in-out 1.1s infinite both; }
  </style>

  <script>
    (function () {
      var lines = [
        "Loading… getting the car wash done, mate. Hold up…",
        "Scrubbing off last week's traffic jam…",
        "Foam party in progress. Car's having a great time.",
        "Bribing the bubbles to work faster…",
        "Popping the hood. Don't look, it's shy.",
        "Righty-tighty, lefty-loosey… righty-tighty…",
        "Checking tyre pressure. And ours. Both fine.",
        "Mechanic says 2 more seconds. He always says that.",
        "Polishing till we can see our own reflection…",
        "Warming up the engine. Vroom vroom.",
        "Almost there. Don't tell the car.",
        "Waxing on. Waxing off.",
        "Finding the 10mm socket. It's always missing.",
        "Making your ride shinier than your Monday mood…"
      ];
      var el = document.getElementById('rp-msg');
      var i = 0;
      var timer = setInterval(function () {
        el.classList.add('out');
        setTimeout(function () {
          i = (i + 1) % lines.length;
          el.textContent = lines[i];
          el.classList.remove('out');
        }, 200);
      }, 2000);

      // App is ready: car drives off, then reveal Reperi's own splash screen.
      // (Flutter's splash fades its picture in over ~0.35s, so the hand-over
      // waits that long to avoid a dark flash.)
      window.addEventListener('flutter-first-frame', function () {
        var root = document.getElementById('reperi-loader');
        if (!root) return;
        clearInterval(timer);
        el.classList.remove('out');
        el.textContent = "Done! Sparkling clean. ✨";
        root.classList.add('leaving');
        setTimeout(function () {
          root.classList.add('fade');
          setTimeout(function () { root.remove(); }, 380);
        }, 500);
      });
    })();
  </script>

    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
