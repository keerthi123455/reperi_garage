<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reperi Washer - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Same OneSignal app as web/index.html and the Flutter app — this
      // just binds *this device's* push identity to whichever washer logs
      // in here, using the 'washer_<washers.id>' scheme so
      // supabase/functions/notify-on-db-change/index.ts can target them.
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "6bc39a67-c05a-4ba4-b950-9ccfc8e9b9b6",
          safari_web_id: "web.onesignal.auto.195e7e66-9dea-4e11-b56c-b4a654da5ab7",
          allowLocalhostAsSecureOrigin: true,
        });
      });

      function oneSignalLogin(externalId) {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.login(externalId);
        });
      }

      function oneSignalLogout() {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.logout();
        });
      }
    </script>
    <style>
        :root {
            --bg: #F3F5F9;
            --card: #FFFFFF;
            --ink: #111827;
            --ink2: #374151;
            --muted: #6B7280;
            --line: #E5E7EB;
            --gold: #B7860B;
            --gold-soft: #FFF7E0;
            --blue: #1D4ED8;
            --blue-soft: #EAF1FF;
            --green: #15803D;
            --green-soft: #E8F7EE;
            --red: #B91C1C;
            --red-soft: #FDECEC;
            --orange: #C2410C;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 14px 12px 60px;
            font-size: 18px;
            line-height: 1.45;
        }
        .container { width: 100%; max-width: 640px; margin: 0 auto; }

        /* Loading / error */
        #loadingScreen { text-align: center; padding: 80px 20px; }
        .loading-spinner {
            display: inline-block; width: 44px; height: 44px;
            border: 5px solid #E5E7EB; border-top-color: var(--gold);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--muted); margin-top: 18px; font-size: 18px; }
        #errorScreen {
            display: none; text-align: center; padding: 50px 22px;
            background: var(--card); border-radius: 22px; margin: 20px 0;
            box-shadow: 0 4px 20px rgba(17, 24, 39, .06);
        }
        .error-icon { font-size: 56px; margin-bottom: 16px; }
        .error-text { color: var(--red); font-size: 20px; font-weight: 700; margin-bottom: 22px; }
        .redirect-btn {
            min-height: 56px; padding: 0 28px; background: var(--gold); color: #fff;
            border: none; border-radius: 14px; font-weight: 800; font-size: 19px; cursor: pointer;
        }

        /* Header */
        #dashboardScreen { display: none; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: var(--card); border-radius: 22px; padding: 18px 18px;
            box-shadow: 0 4px 20px rgba(17, 24, 39, .06); margin-bottom: 14px;
        }
        .hello { font-size: 26px; font-weight: 900; line-height: 1.2; }
        .hello-sub { color: var(--muted); font-size: 16px; margin-top: 2px; word-break: break-all; }
        .logout-btn {
            flex-shrink: 0; min-height: 48px; padding: 0 16px; background: var(--red-soft); color: var(--red);
            border: 2px solid #F5C2C2; border-radius: 14px; font-weight: 800; font-size: 16px; cursor: pointer;
        }

        /* Today summary */
        .summary { display: flex; gap: 10px; margin-bottom: 22px; }
        .sum-box {
            flex: 1; background: var(--card); border-radius: 18px; padding: 14px 10px; text-align: center;
            box-shadow: 0 4px 20px rgba(17, 24, 39, .06);
        }
        .sum-num { font-size: 34px; font-weight: 900; line-height: 1.1; }
        .sum-lbl { font-size: 15px; color: var(--muted); font-weight: 700; margin-top: 2px; }

        /* Section titles */
        .subscriptions-title {
            font-size: 24px; font-weight: 900; color: var(--ink);
            margin: 26px 4px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .count-badge {
            font-size: 16px; font-weight: 800; padding: 4px 12px; border-radius: 30px;
            background: var(--gold-soft); color: var(--gold);
        }
        .subscriptions-list { display: flex; flex-direction: column; gap: 16px; }

        /* Job card */
        .subscription-card {
            background: var(--card); border-radius: 22px; padding: 16px 14px;
            box-shadow: 0 4px 20px rgba(17, 24, 39, .07); border: 2px solid transparent;
        }
        .subscription-card.todo { border-color: #F2DFA6; }
        .subscription-card.finished { opacity: .7; }
        .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .subscription-vehicle { font-size: 23px; font-weight: 900; line-height: 1.25; }
        .subscription-plate {
            display: inline-block; margin-top: 8px; padding: 5px 12px; border: 2px solid var(--ink);
            border-radius: 8px; font-size: 19px; font-weight: 900; letter-spacing: 1.5px;
            text-transform: uppercase; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            background: #FFFBEA;
        }
        .vehicle-line { font-size: 19px; font-weight: 700; color: var(--ink2); margin-top: 6px; }
        .subscription-status {
            flex-shrink: 0; padding: 6px 12px; border-radius: 30px; font-size: 15px; font-weight: 900;
            background: var(--gold-soft); color: var(--gold); white-space: nowrap;
        }
        .subscription-status.done { background: var(--green-soft); color: var(--green); }

        .time-banner {
            margin-top: 14px; display: flex; align-items: center; gap: 10px;
            background: var(--blue-soft); color: var(--blue); border-radius: 14px; padding: 12px 14px;
            font-size: 21px; font-weight: 900;
        }
        .info { margin-top: 14px; display: grid; gap: 10px; }
        .info-row { display: flex; gap: 12px; align-items: flex-start; }
        .info-ic { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; line-height: 1.3; }
        .info-k { font-size: 14px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
        .info-v { font-size: 20px; font-weight: 700; color: var(--ink); word-break: break-word; }
        .cash { color: var(--orange); font-weight: 900; }

        .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .navigate-btn {
            flex: 1 1 140px; min-height: 58px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 0 14px; border-radius: 16px; font-weight: 900; font-size: 19px;
            text-decoration: none; cursor: pointer; border: none;
            background: var(--blue); color: #fff;
        }
        .navigate-btn.call { background: var(--green); }
        .navigate-btn.disabled { background: #E5E7EB; color: #9CA3AF; pointer-events: none; }

        /* Photos */
        .photo-step {
            margin-top: 20px; background: #FAFBFD; border: 2px solid var(--line); border-radius: 18px; padding: 14px 12px;
        }
        .step-head { display: flex; align-items: center; gap: 10px; }
        .step-num {
            width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff;
            display: grid; place-items: center; font-weight: 900; font-size: 18px; flex-shrink: 0;
        }
        .step-num.ok { background: var(--green); }
        .step-title { font-size: 21px; font-weight: 900; }
        .step-hint { font-size: 17px; color: var(--ink2); margin: 6px 0 12px 0; font-weight: 600; }
        .shots { display: flex; gap: 10px; }
        .shot-col { flex: 1; min-width: 0; }
        .shot {
            position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden;
            border: 3px dashed #93B4F5; background: var(--blue-soft); color: var(--blue);
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            cursor: pointer; padding: 4px;
        }
        .shot .cam { font-size: 38px; line-height: 1; }
        .shot .tap { font-size: 14px; font-weight: 900; margin-top: 6px; letter-spacing: .3px; white-space: nowrap; }
        .shot.next { border-color: var(--blue); animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(29, 78, 216, .45); }
            50% { box-shadow: 0 0 0 8px rgba(29, 78, 216, 0); }
        }
        .shot.has { border: 3px solid var(--green); background: #000; padding: 0; }
        .shot.has img { width: 100%; height: 100%; object-fit: cover; }
        .shot .tick {
            position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%;
            background: var(--green); color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 900;
        }
        .shot .change {
            position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, .6); color: #fff;
            font-size: 13px; font-weight: 800; padding: 5px 0; white-space: nowrap;
        }
        .shot-label { text-align: center; font-size: 17px; font-weight: 900; margin-top: 8px; }
        .shot-label small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
        .photo-progress { margin-top: 12px; font-size: 17px; font-weight: 800; color: var(--ink2); text-align: center; }

        .upload-btn {
            width: 100%; min-height: 62px; margin-top: 16px; border: none; border-radius: 16px;
            background: var(--green); color: #fff; font-weight: 900; font-size: 20px; letter-spacing: .3px; cursor: pointer;
        }
        .upload-btn.wait { background: #9CA3AF; }
        .upload-btn:disabled { opacity: .6; cursor: not-allowed; }

        .upload-status { font-size: 17px; font-weight: 700; margin-top: 12px; padding: 12px; border-radius: 12px; display: none; }
        .upload-status.success { display: block; color: var(--green); background: var(--green-soft); }
        .upload-status.error { display: block; color: var(--red); background: var(--red-soft); }

        /* Add-on services (doorstep washes) */
        .addon-list { display: grid; gap: 10px; margin: 4px 0 4px 0; }
        .addon-item { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #fff; }
        .addon-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
        .addon-name { font-size: 19px; font-weight: 900; word-break: break-word; }
        .addon-price { font-size: 19px; font-weight: 900; white-space: nowrap; }
        .addon-pill { display: inline-block; margin-top: 6px; padding: 5px 10px; border-radius: 20px; font-size: 14px; font-weight: 900; }
        .addon-pill.wait { background: var(--gold-soft); color: var(--gold); }
        .addon-pill.paid { background: var(--green-soft); color: var(--green); }
        .addon-pill.no { background: var(--red-soft); color: var(--red); }
        .addon-reason { font-size: 15px; color: var(--ink2); margin-top: 6px; }
        .addon-cancel { margin-top: 8px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--red);
            background: #fff; color: var(--red); font-weight: 900; font-size: 15px; cursor: pointer; }
        .addon-btn { width: 100%; min-height: 58px; margin-top: 12px; border: none; border-radius: 16px;
            background: var(--blue); color: #fff; font-weight: 900; font-size: 19px; cursor: pointer; }
        .addon-form { margin-top: 12px; display: grid; gap: 10px; }
        .addon-form label { font-size: 15px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
        .addon-form input[type=text], .addon-form input[type=number], .addon-form textarea {
            width: 100%; box-sizing: border-box; font-size: 19px; padding: 14px; border-radius: 12px;
            border: 2px solid var(--line); font-family: inherit; color: var(--ink); background: #fff; }
        .addon-form input:focus, .addon-form textarea:focus { outline: none; border-color: var(--blue); }
        .addon-photo { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 12px;
            border: 2px dashed var(--blue); color: var(--blue); font-weight: 900; font-size: 17px; cursor: pointer; background: var(--blue-soft); }
        .addon-actions { display: flex; gap: 10px; }
        .addon-actions button { flex: 1; min-height: 56px; border-radius: 14px; font-weight: 900; font-size: 18px; cursor: pointer; }
        .addon-send { border: none; background: var(--blue); color: #fff; }
        .addon-send:disabled { opacity: .6; cursor: not-allowed; }
        .addon-close { border: 2px solid var(--line); background: #fff; color: var(--ink2); }
        .bill-wait { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--gold-soft); color: var(--gold);
            font-weight: 800; font-size: 16px; }

        .done-note {
            margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--green-soft); color: var(--green);
            font-weight: 900; font-size: 19px; text-align: center;
        }

        /* Subscriptions */
        .open-btn {
            width: 100%; min-height: 60px; margin-top: 16px; border: 3px solid var(--blue); border-radius: 16px;
            background: var(--blue-soft); color: var(--blue); font-weight: 900; font-size: 20px; cursor: pointer;
        }
        .subscription-expanded { display: none; }
        .subscription-expanded.show { display: block; }
        .completed-count {
            margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--gold-soft); color: var(--gold);
            font-weight: 900; font-size: 18px; text-align: center;
        }
        .no-subscriptions {
            text-align: center; padding: 30px 16px; color: var(--muted); font-size: 19px; font-weight: 700;
            background: var(--card); border-radius: 20px;
        }

        @media (max-width: 380px) {
            body { font-size: 17px; }
            .shots { gap: 7px; }
            .shot .cam { font-size: 30px; }
            .shot .tap { font-size: 13px; }
            .shot-label { font-size: 15px; }
        }

        /* ── Collect payment (UPI QR / cash) ── */
        .cp-dim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9999; display: flex; align-items: flex-end; justify-content: center; }
        .cp-dim.center { align-items: center; padding: 20px; }
        .cp-sheet { width: 100%; max-width: 520px; max-height: 94vh; overflow-y: auto; background: #fff; border-radius: 26px 26px 0 0;
            padding: 14px 18px calc(22px + env(safe-area-inset-bottom)); box-sizing: border-box; font-family: inherit; color: #15171A; }
        .cp-dialog { width: 100%; max-width: 380px; background: #fff; border-radius: 22px; padding: 22px; box-sizing: border-box; text-align: center; color: #15171A; }
        .cp-handle { width: 40px; height: 4px; border-radius: 2px; background: #E3E0D8; margin: 0 auto 14px; }
        .cp-h { font-size: 22px; font-weight: 900; }
        .cp-sub { font-size: 16px; font-weight: 600; color: #63656B; margin-top: 4px; line-height: 1.4; }
        .cp-amt { font-size: 40px; font-weight: 900; color: #022B57; margin: 10px 0 4px; word-break: break-word; }
        .cp-opt { display: flex; align-items: center; gap: 14px; width: 100%; border: 2px solid #E3E0D8; border-radius: 18px; padding: 16px;
            margin-top: 12px; background: #fff; text-align: left; cursor: pointer; font-family: inherit; box-sizing: border-box; }
        .cp-opt:active { background: #F6F5F1; }
        .cp-ic { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; font-size: 27px; flex-shrink: 0; }
        .cp-opt b { display: block; font-size: 20px; font-weight: 900; color: #15171A; }
        .cp-opt span { font-size: 15px; font-weight: 600; color: #63656B; }
        .cp-qr { width: 270px; max-width: 100%; margin: 14px auto 0; border: 2px solid #022B57; border-radius: 20px; padding: 14px; box-sizing: border-box; text-align: center; background: #fff; }
        .cp-qr img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
        .cp-qr-name { font-size: 13px; font-weight: 800; color: #63656B; margin-top: 6px; word-break: break-word; }
        .cp-note { background: #FFF4C2; color: #8A5A00; border-radius: 12px; padding: 10px 12px; font-size: 15px; font-weight: 700; margin-top: 14px; line-height: 1.4; }
        .cp-err { background: #FDE8E8; color: #D93A3F; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; margin-top: 14px; line-height: 1.4; text-align: center; }
        .cp-btn { display: block; width: 100%; min-height: 58px; border-radius: 16px; font-size: 18px; font-weight: 900; margin-top: 12px; cursor: pointer; font-family: inherit; }
        .cp-green { background: #17803D; color: #fff; border: none; }
        .cp-ghost { background: #fff; color: #63656B; border: 2px solid #E3E0D8; }
        .cp-row { display: flex; gap: 10px; margin-top: 8px; }
        .cp-row .cp-btn { flex: 1; }
        .cp-spin { width: 40px; height: 40px; border: 4px solid #E3E0D8; border-top-color: #022B57; border-radius: 50%; margin: 110px auto; animation: cpspin 1s linear infinite; }
        @keyframes cpspin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingScreen">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading your washes…</p>
        </div>

        <div id="errorScreen">
            <div class="error-icon">🔐</div>
            <p class="error-text" id="errorText">Please log in first</p>
            <button class="redirect-btn" onclick="window.location.href='washerlogin.html'">Go to Login</button>
        </div>

        <div id="dashboardScreen">
            <div class="topbar">
                <div style="min-width:0">
                    <div class="hello">👋 Hello!</div>
                    <div class="hello-sub"><span id="washerEmail"></span> · ID <b id="washerId"></b></div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>

            <div class="summary">
                <div class="sum-box"><div class="sum-num" id="sumTodo">–</div><div class="sum-lbl">Washes to do</div></div>
                <div class="sum-box"><div class="sum-num" id="sumDone" style="color:var(--green)">–</div><div class="sum-lbl">Done</div></div>
            </div>

            <!-- One-time doorstep washes (car & bike) from the bookings table. -->
            <div id="doorstepContent"></div>

            <!-- Apartment offer washes (₹1 / ₹199 / ₹999). Only shows up for the
                 washers in the 'washers_offer' pool — everyone else has none. -->
            <div id="offerContent"></div>

            <div id="subscriptionsContent">
                <div style="text-align: center; padding: 40px; color: var(--muted);">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">Loading…</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rmvxqjyoqfinbrpubsvp.supabase.co/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdnhxanlvcWZpbmJycHVic3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzQyNDcsImV4cCI6MjA5MjgxMDI0N30.NAxb2XnicLSaBoA4kpTFmmutT68Z2ksu-T-P_NUxy5E';

        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentWasherId = null;

        window.addEventListener('load', async () => {
            console.log('🔍 Starting authentication check...');
            await checkAuthentication();
        });

        async function checkAuthentication() {
            try {
                console.log('📡 Calling getSession()...');
                const { data: { session } } = await sbClient.auth.getSession();
                console.log('✅ Session check complete. Session:', session ? 'Found' : 'Not found');

                if (!session) {
                    console.log('❌ No session found - redirecting to login');
                    showErrorScreen('You must be logged in to access this page');
                    return;
                }

                console.log('✅ User authenticated:', session.user.email);
                showDashboard(session.user.email);
            } catch (err) {
                console.error('❌ Auth error:', err);
                showErrorScreen(`Authentication error: ${err.message}`);
            }
        }

        function showErrorScreen(message) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('errorScreen').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        async function showDashboard(email) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            document.getElementById('washerEmail').textContent = email;
            await fetchWasherData(email);
        }

        async function fetchWasherData(email) {
            try {
                const { data: washerData, error: washerError } = await sbClient
                    .from('washers')
                    .select('id, email')
                    .eq('email', email)
                    .single();

                if (washerError) throw new Error('Washer profile not found');

                currentWasherId = washerData.id;
                document.getElementById('washerId').textContent = currentWasherId;
                console.log('✅ Washer found:', { id: currentWasherId, email });
                oneSignalLogin('washer_' + currentWasherId);

                await Promise.all([
                    fetchOfferBookings(currentWasherId),
                    fetchDoorstepBookings(),
                    fetchSubscriptions(currentWasherId),
                ]);
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('subscriptionsContent').innerHTML = `
                    <div class="no-subscriptions">
                        <p>❌ Error: ${err.message}</p>
                    </div>
                `;
            }
        }

        async function fetchSubscriptions(washerId) {
            try {
                console.log('🔍 Fetching subscriptions for washer_id:', washerId);

                const { data: subscriptions, error } = await sbClient
                    .from('monthlywash_table')
                    .select('*')
                    .eq('washer_id', washerId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Only plans still running: an old plan that was renewed is
                // replaced by its new row, and a plan that wasn't renewed
                // disappears once its end date has passed (IST).
                const current = (subscriptions || []).filter((s) =>
                    String(s.status || 'active').toLowerCase() !== 'renewed' &&
                    (!s.end_date || istDaysUntil(s.end_date) >= 0));

                console.log('✅ Subscriptions fetched:', current);
                const vehiclesById = await fetchVehicles(current);
                displaySubscriptions(current, vehiclesById);
            } catch (err) {
                console.error('Error fetching subscriptions:', err);
                document.getElementById('subscriptionsContent').innerHTML = `
                    <div class="no-subscriptions">
                        <p>❌ Error loading subscriptions: ${err.message}</p>
                    </div>
                `;
            }
        }

        // Looks up each subscription's vehicle (name + number plate) from the
        // `vehicles` table, so washers see "Hyundai Creta · KA01AB1234"
        // instead of an internal vehicle ID. Never breaks the dashboard: if
        // the lookup fails (e.g. database rules don't allow it), cards fall
        // back to the brand/model saved on the subscription itself.
        async function fetchVehicles(subscriptions) {
            const byId = {};
            const ids = [...new Set((subscriptions || [])
                .map((s) => s.vehicle_id)
                .filter((id) => id != null && id !== ''))];
            if (ids.length === 0) return byId;
            try {
                const { data, error } = await sbClient
                    .from('vehicles')
                    .select('id, car_brand, car_model, car_number, vehicle_type')
                    .in('id', ids);
                if (error) throw error;
                (data || []).forEach((v) => { byId[String(v.id)] = v; });
                if ((data || []).length < ids.length) {
                    console.warn('⚠️ Some vehicles could not be read (missing, or blocked by database rules):',
                        ids.filter((id) => !byId[String(id)]));
                }
            } catch (err) {
                console.warn('⚠️ Could not load vehicle details:', err.message || err);
            }
            return byId;
        }

        // Whole days from today to [iso], as IST calendar dates (0 = today).
        function istDaysUntil(iso) {
            const IST = 330 * 60 * 1000;
            const day = (t) => Math.floor((t + IST) / 86400000);
            return day(new Date(iso).getTime()) - day(Date.now());
        }
        function planEndText(s) {
            if (!s.end_date) return '';
            const d = istDaysUntil(s.end_date);
            const date = new Date(s.end_date).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' });
            if (d === 0) return `Ends TODAY (${date})`;
            if (d === 1) return `Ends tomorrow (${date})`;
            return `Till ${date}`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ── Shared card pieces (big text, big buttons) ─────────────────
        function infoRow(icon, key, valueHtml) {
            return `<div class="info-row"><div class="info-ic">${icon}</div>
                <div style="min-width:0"><div class="info-k">${key}</div><div class="info-v">${valueHtml}</div></div></div>`;
        }

        function actionButtons(phone, lat, lng) {
            const call = phone
                ? `<a class="navigate-btn call" href="tel:${escapeHtml(phone)}">📞 Call</a>` : '';
            const nav = lat != null && lng != null
                ? `<a class="navigate-btn" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving" target="_blank" rel="noopener">🧭 Navigate</a>`
                : `<span class="navigate-btn disabled">🧭 No location</span>`;
            return `<div class="btn-row">${call}${nav}</div>`;
        }

        // Counts for the two boxes at the top.
        const jobCounts = { offer: { todo: 0, done: 0 }, door: { todo: 0, done: 0 } };
        function isToday(iso) {
            if (!iso) return false;
            return new Date(iso).toDateString() === new Date().toDateString();
        }
        function updateSummary() {
            const todo = jobCounts.offer.todo + jobCounts.door.todo;
            const done = jobCounts.offer.done + jobCounts.door.done;
            const t = document.getElementById('sumTodo'), d = document.getElementById('sumDone');
            if (t) t.textContent = todo;
            if (d) d.textContent = done;
        }

        function displaySubscriptions(subscriptions, vehiclesById = {}) {
            const content = document.getElementById('subscriptionsContent');

            if (!subscriptions || subscriptions.length === 0) {
                content.innerHTML = '';
                return;
            }

            let html = `<div class="subscriptions-title">📅 Monthly plans <span class="count-badge">${subscriptions.length}</span></div>
                       <div class="subscriptions-list">`;

            subscriptions.forEach((sub) => {
                const totalCompleted = sub.total_services_completed || 0;
                const vehicle = vehiclesById[String(sub.vehicle_id)] || {};
                const vehicleName = [vehicle.car_brand || sub.car_brand, vehicle.car_model || sub.car_model]
                    .filter(Boolean).join(' ') || 'Vehicle';
                const vehicleNumber = vehicle.car_number || sub.car_number || '';
                const address = (sub.pickup_address_name ? sub.pickup_address_name + ' · ' : '') + (sub.pickup_address || 'Not given');
                const shot = (stage, n, label, hint) => `
                    <div class="shot-col">
                        <label for="${stage}-${sub.id}" class="shot ${stage === 'before' ? 'next' : ''}" id="sub-slot-${sub.id}-${stage}">
                            <span class="cam">📷</span><span class="tap">TAP HERE</span>
                        </label>
                        <input type="file" id="${stage}-${sub.id}" accept="image/*" hidden
                               onchange="previewSubPhoto(this, ${sub.id}, '${stage}')">
                        <div class="shot-label">${n}. ${label}<small>${hint}</small></div>
                    </div>`;
                html += `
                    <div class="subscription-card">
                        <div class="job-top">
                            <div style="min-width:0">
                                <div class="subscription-vehicle">${escapeHtml(vehicleName)}</div>
                                ${vehicleNumber ? `<div class="subscription-plate">${escapeHtml(vehicleNumber)}</div>` : ''}
                            </div>
                            <div class="subscription-status">${escapeHtml(sub.status || 'Active')}</div>
                        </div>
                        <div class="info">
                            ${infoRow('📍', 'Address', escapeHtml(address))}
                            ${infoRow('🧾', 'Plan', escapeHtml([sub.plan_title || sub.subscription_type, sub.frequency].filter(Boolean).join(' · ') || 'Monthly wash'))}
                            ${sub.end_date ? infoRow('📆', 'Plan dates', escapeHtml(planEndText(sub)) + (sub.renewed_from_id ? ' · <span style="color:var(--green)">Renewed</span>' : '')) : ''}
                        </div>
                        ${actionButtons('', sub.pickup_latitude, sub.pickup_longitude)}
                        <div class="completed-count">✅ Washes done on this plan: ${totalCompleted}</div>

                        <button class="open-btn" id="open-${sub.id}" onclick="toggleSubscription(${sub.id})">📸 ADD TODAY'S WASH</button>

                        <div class="subscription-expanded" id="expanded-${sub.id}">
                            <div class="photo-step">
                                <div class="step-head"><div class="step-num">1</div><div class="step-title">Take 2 photos</div></div>
                                <div class="step-hint">👇 Tap each blue box — take a photo or pick one from the gallery</div>
                                <div class="shots">
                                    ${shot('before', 1, 'Before', 'before washing')}
                                    ${shot('after', 2, 'After', 'after washing')}
                                </div>
                            </div>
                            <div class="photo-step">
                                <div class="step-head"><div class="step-num">2</div><div class="step-title">Save the wash</div></div>
                                <div class="step-hint">Tap the green button when both photos are added</div>
                                <button class="upload-btn" onclick="uploadServicePhotos(${sub.id})">✅ UPLOAD &amp; COMPLETE</button>
                                <div class="upload-status" id="status-${sub.id}"></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            content.innerHTML = html;
        }

        // Shows the picked photo inside its box straight away.
        function previewSubPhoto(input, subId, stage) {
            const box = document.getElementById(`sub-slot-${subId}-${stage}`);
            const file = input.files && input.files[0];
            if (!box || !file) return;
            const url = URL.createObjectURL(file);
            box.className = 'shot has';
            box.innerHTML = `<img src="${url}" alt=""><span class="tick">✓</span><span class="change">Tap to change</span>`;
            // Point at the next empty box.
            if (stage === 'before') {
                const after = document.getElementById(`sub-slot-${subId}-after`);
                if (after && !after.classList.contains('has')) after.classList.add('next');
            }
        }

        // ── Apartment offer washes ───────────────────────────────────────
        // Rows in `offer_bookings` that booking-api assigned to this washer
        // (it alternates between the washers in the 'washers_offer' pool).
        async function fetchOfferBookings(washerId) {
            const box = document.getElementById('offerContent');
            try {
                const { data, error } = await sbClient
                    .from('offer_bookings')
                    .select('*')
                    .eq('washer_id', washerId)
                    .order('created_at', { ascending: false })
                    .limit(200);
                if (error) throw error;
                displayOfferBookings(data || []);
            } catch (err) {
                // Never break the rest of the dashboard over this section.
                console.warn('⚠️ Could not load offer washes:', err.message || err);
                box.innerHTML = '';
            }
        }

        function isOfferDone(b) {
            return /^(completed|delivered|cancell?ed)$/i.test(b.booking_status || '');
        }

        function displayOfferBookings(rows) {
            const box = document.getElementById('offerContent');
            jobCounts.offer = {
                todo: rows.filter((b) => !isOfferDone(b)).length,
                done: rows.filter((b) => isOfferDone(b) && isToday(b.completed_at)).length,
            };
            updateSummary();
            if (!rows.length) { box.innerHTML = ''; return; }
            // Open jobs first — soonest wash time on top (older bookings with
            // no time picked go by booking time) — then finished ones.
            const sortKey = (b) => new Date(b.slot_start || b.created_at).getTime();
            const open = rows.filter((b) => !isOfferDone(b))
                .sort((a, b) => sortKey(a) - sortKey(b));
            const done = rows.filter(isOfferDone);

            let html = `<div class="subscriptions-title">🏢 Apartment washes <span class="count-badge">${open.length} to do</span></div>
                        <div class="subscriptions-list">`;
            [...open, ...done].forEach((b) => {
                const apartment = b.pickup_address_name || b.pickup_address || 'Apartment';
                const extra = b.pickup_address && b.pickup_address !== apartment ? b.pickup_address : '';
                html += washCardHtml(b, 'offer', {
                    title: b.package_name || 'Offer wash',
                    vehicleLine: '🏢 ' + apartment,
                    plate: '',
                    address: extra,
                    price: '₹' + (b.package_price ?? '0'),
                    cash: String(b.payment_status || '').toLowerCase() === 'cod',
                });
            });
            html += '</div>';
            box.innerHTML = html;
        }

        // One card for offer + doorstep washes: time, customer, address,
        // Call / Navigate, the photo boxes, then the green finish button.
        function washCardHtml(b, kind, o) {
            const id = escapeHtml(b.id);
            const finished = isOfferDone(b);
            const phone = (b.customer_phone || '').toString();
            const slot = slotText(b);
            return `
                <div class="subscription-card ${finished ? 'finished' : 'todo'}">
                    <div class="job-top">
                        <div style="min-width:0">
                            <div class="subscription-vehicle">${escapeHtml(o.title)}</div>
                            ${o.vehicleLine ? `<div class="vehicle-line">${escapeHtml(o.vehicleLine)}</div>` : ''}
                            ${o.plate ? `<div class="subscription-plate">${escapeHtml(o.plate)}</div>` : ''}
                        </div>
                        <div class="subscription-status ${finished ? 'done' : ''}">${finished ? '✓ DONE' : escapeHtml(b.booking_status || 'To do')}</div>
                    </div>
                    ${slot ? `<div class="time-banner">🕒 ${escapeHtml(slot)}</div>` : ''}
                    <div class="info">
                        ${infoRow('👤', 'Customer', escapeHtml(b.customer_name || '—') + (phone ? `<div style="font-size:18px;color:var(--ink2)">${escapeHtml(phone)}</div>` : ''))}
                        ${o.address ? infoRow('📍', 'Address', escapeHtml(o.address)) : ''}
                        ${infoRow('💰', 'Payment', o.cash
                            ? `<span class="cash">${escapeHtml(o.price)} · COLLECT PAYMENT (UPI or cash)</span>`
                            : `${escapeHtml(o.price)} · <span style="color:var(--green)">Paid online</span>`)}
                    </div>
                    ${finished ? '' : actionButtons(phone, b.pickup_latitude, b.pickup_longitude)}
                    ${offerPhotosHtml(b, finished, kind)}
                    ${kind === 'door' ? addonSectionHtml(b, finished) : ''}
                    ${finished ? '<div class="done-note">✅ Wash completed — thank you!</div>' : `
                    <div class="photo-step">
                        <div class="step-head"><div class="step-num">2</div><div class="step-title">Finish the wash</div></div>
                        <div class="step-hint">When the wash is done, tap the green button. The customer gets the photos.</div>
                        <button class="upload-btn" id="offer-btn-${id}"
                                onclick="completeOfferBooking('${id}'${kind === 'offer' ? '' : ",'" + kind + "'"})">✅ MARK WASH COMPLETED</button>
                        <div class="upload-status" id="offer-status-${id}"></div>
                    </div>`}
                </div>`;
        }

        // ── Before / During / After photos ──────────────────────────────
        // One slot per stage: tap to take/choose a photo, it uploads straight
        // away and the customer sees it in the app.
        const OFFER_STAGES = [['before', 'Before'], ['during', 'During wash'], ['after', 'After']];
        let offerRows = {};

        // Offer washes (offer_bookings) and doorstep washes (bookings) share
        // the photo + complete code; only the server functions differ.
        const WASH_KINDS = {
            offer: {
                photoRpc: 'set_offer_wash_photo', completeRpc: 'complete_offer_booking',
                folder: 'offer-photos', reload: () => fetchOfferBookings(currentWasherId),
            },
            door: {
                photoRpc: 'set_booking_wash_photo', completeRpc: 'complete_booking_wash',
                folder: 'doorstep-photos', reload: () => fetchDoorstepBookings(),
                // Also keep a copy where garage update photos live, so on
                // "completed" it shows in the customer's service timeline.
                timelineCopy: true,
            },
        };

        const STAGE_HINT = { before: 'before washing', during: 'while washing', after: 'after washing' };

        function offerPhotosHtml(b, finished, kind = 'offer') {
            offerRows[kind + ':' + String(b.id)] = b;
            const id = escapeHtml(b.id);
            const have = OFFER_STAGES.filter(([stage]) => b[stage + '_photo_url']).length;
            const firstEmpty = OFFER_STAGES.findIndex(([stage]) => !b[stage + '_photo_url']);
            if (finished && !have) return '';
            const slots = OFFER_STAGES.map(([stage, label], i) => {
                const url = b[stage + '_photo_url'];
                const inner = url
                    ? `<img src="${escapeHtml(url)}" alt="${label}"><span class="tick">✓</span>
                       ${finished ? '' : '<span class="change">Tap to change</span>'}`
                    : `<span class="cam">📷</span><span class="tap">TAP HERE</span>`;
                const cls = url ? 'shot has' : 'shot' + (i === firstEmpty && !finished ? ' next' : '');
                const boxHtml = `<div class="${cls}" id="offer-slot-${id}-${stage}">${inner}</div>`;
                return `<div class="shot-col">
                    ${finished
                        ? (url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="display:block">${boxHtml}</a>` : boxHtml)
                        : `<label style="display:block;cursor:pointer">${boxHtml}<input type="file" accept="image/*" hidden onchange="uploadOfferPhoto('${id}','${stage}',this,'${kind}')"></label>`}
                    <div class="shot-label">${i + 1}. ${label.replace(' wash', '')}<small>${STAGE_HINT[stage]}</small></div>
                </div>`;
            }).join('');
            return `<div class="photo-step">
                ${finished
                    ? `<div class="step-head"><div class="step-num ok">✓</div><div class="step-title">Wash photos</div></div><div style="height:12px"></div>`
                    : `<div class="step-head"><div class="step-num ${have === 3 ? 'ok' : ''}">${have === 3 ? '✓' : '1'}</div><div class="step-title">Take 3 photos</div></div>
                       <div class="step-hint">👇 Tap each blue box — take a photo or pick one from the gallery. The customer sees these photos.</div>`}
                <div class="shots">${slots}</div>
                ${finished ? '' : `<div class="photo-progress">${have === 3 ? '✅ All 3 photos added' : `📷 ${have} of 3 photos added`}</div>`}
                <div class="upload-status" id="offer-photo-status-${id}"></div>
            </div>`;
        }

        // Shrink big phone photos before uploading (max 1600px JPEG).
        function shrinkImage(file, max = 1600) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const k = Math.min(1, max / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url);
                    c.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Could not read photo')), 'image/jpeg', 0.82);
                };
                img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
                img.src = url;
            });
        }

        async function uploadOfferPhoto(id, stage, input, kind = 'offer') {
            const k = WASH_KINDS[kind];
            const file = input.files && input.files[0];
            if (!file) return;
            const statusDiv = document.getElementById('offer-photo-status-' + id);
            const slot = document.getElementById(`offer-slot-${id}-${stage}`);
            if (slot) {
                slot.className = 'shot';
                slot.innerHTML = '<div class="loading-spinner" style="width:34px;height:34px"></div><span class="tap">UPLOADING…</span>';
            }
            try {
                const blob = await shrinkImage(file);
                const path = `${k.folder}/${id}/${stage}-${Date.now()}.jpg`;
                const { error: upErr } = await sbClient.storage
                    .from('subscription-services')
                    .upload(path, blob, { contentType: 'image/jpeg' });
                if (upErr) throw upErr;
                const { data } = sbClient.storage.from('subscription-services').getPublicUrl(path);
                const params = { p_id: String(id), p_stage: stage, p_url: data.publicUrl };
                if (k.timelineCopy) {
                    const privatePath = `washer-photos/${id}/${stage}-${Date.now()}.jpg`;
                    const { error: copyErr } = await sbClient.storage
                        .from('booking-images')
                        .upload(privatePath, blob, { contentType: 'image/jpeg' });
                    if (copyErr) throw copyErr;
                    params.p_path = privatePath;
                }
                const { error } = await sbClient.rpc(k.photoRpc, params);
                if (error) throw error;
                await k.reload();
                const again = document.getElementById('offer-photo-status-' + id);
                if (again) showUploadStatus(again, 'success', '✅ Photo saved');
            } catch (err) {
                console.error('Offer photo upload failed:', err);
                if (statusDiv) showUploadStatus(statusDiv, 'error', '❌ ' + (err.message || 'Upload failed'));
                await k.reload();
            }
        }

        async function completeOfferBooking(id, kind = 'offer') {
            const k = WASH_KINDS[kind];
            const row = offerRows[kind + ':' + String(id)] || {};
            const missing = OFFER_STAGES.filter(([stage]) => !row[stage + '_photo_url']).map(([, label]) => label);
            if (missing.length && !confirm(`Missing photos: ${missing.join(', ')}.\n\nComplete the wash anyway?`)) return;
            // Cash wash: take the payment first — UPI (our QR) or cash.
            const isCash = String(row.payment_status || '').toLowerCase() === 'cod';
            let collectedVia = null;
            if (isCash) {
                const p = row.package_price;
                const amount = p == null || p === '' ? ''
                    : (/^\d+(\.\d+)?$/.test(String(p)) ? '₹' + Number(p).toLocaleString('en-IN') : String(p));
                collectedVia = await collectPayment(amount);
                if (!collectedVia) return;
            } else if (!confirm('Mark this wash as completed? The customer will be notified.')) return;
            const btn = document.getElementById('offer-btn-' + id);
            const statusDiv = document.getElementById('offer-status-' + id);
            if (btn) { btn.disabled = true; btn.textContent = 'SAVING...'; }
            try {
                // Server-side check: only the washer this booking is assigned
                // to can complete it (see offer_apartment_booking.sql).
                const { error } = await sbClient.rpc(k.completeRpc, { p_id: String(id) });
                if (error) throw error;
                if (collectedVia) await recordCollection(kind === 'offer' ? 'offer_bookings' : 'bookings', id, collectedVia);
                await k.reload();
            } catch (err) {
                console.error('Error completing offer wash:', err);
                if (btn) { btn.disabled = false; btn.textContent = '✅ MARK WASH COMPLETED'; }
                if (statusDiv) showUploadStatus(statusDiv, 'error', '❌ ' + (err.message || 'Could not save'));
            }
        }

        // ── Collect payment: UPI (the QR picked in the CRM) or cash ─────
        // Resolves 'upi' / 'cash' once confirmed, or null if cancelled.
        // Same flow as the garage app (supabase/payment_collection.sql).
        function cpEsc(v) {
            return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function cpOverlay(html, center) {
            const dim = document.createElement('div');
            dim.className = 'cp-dim' + (center ? ' center' : '');
            dim.innerHTML = html;
            document.body.appendChild(dim);
            return dim;
        }
        function collectPayment(amountText) {
            const amt = cpEsc(amountText || '—');
            return new Promise((resolve) => {
                const choose = () => {
                    const dim = cpOverlay(`<div class="cp-sheet" role="dialog" aria-label="Collect payment">
                        <div class="cp-handle"></div>
                        <div class="cp-h">Collect payment</div>
                        <div class="cp-sub">How is the customer paying?</div>
                        <div class="cp-amt">${amt}</div>
                        <button class="cp-opt" data-m="upi"><div class="cp-ic" style="background:#E6EEFF">📱</div><div><b>UPI</b><span>Show our QR — the customer scans and pays</span></div></button>
                        <button class="cp-opt" data-m="cash"><div class="cp-ic" style="background:#E3F6E8">💵</div><div><b>Cash</b><span>The customer pays you in cash</span></div></button>
                        <button class="cp-btn cp-ghost" data-m="">Cancel</button>
                    </div>`);
                    dim.addEventListener('click', (e) => {
                        const b = e.target.closest('[data-m]');
                        if (!b && e.target !== dim) return;
                        dim.remove();
                        const m = b ? b.dataset.m : '';
                        if (m === 'upi') upi();
                        else if (m === 'cash') cash();
                        else resolve(null);
                    });
                };
                const cash = () => {
                    const dim = cpOverlay(`<div class="cp-dialog" role="dialog" aria-label="Cash received?">
                        <div style="font-size:42px">💵</div>
                        <div class="cp-h" style="margin-top:6px">Cash received?</div>
                        <div class="cp-sub">Did you collect <b style="color:#15171A">${amt}</b> in cash from the customer?</div>
                        <div class="cp-row"><button class="cp-btn cp-ghost" data-a="no">No</button><button class="cp-btn cp-green" data-a="yes">Yes, received</button></div>
                    </div>`, true);
                    dim.addEventListener('click', (e) => {
                        const b = e.target.closest('[data-a]');
                        if (!b) return;
                        dim.remove();
                        resolve(b.dataset.a === 'yes' ? 'cash' : null);
                    });
                };
                const upi = async () => {
                    const dim = cpOverlay(`<div class="cp-sheet" role="dialog" aria-label="Scan to pay">
                        <div class="cp-handle"></div>
                        <div class="cp-h" style="text-align:center">Scan to pay</div>
                        <div class="cp-amt" style="text-align:center">${amt}</div>
                        <div data-qr><div class="cp-spin"></div></div>
                        <div class="cp-note">Check the customer's phone shows <b>"Payment successful"</b> for ${amt} before tapping below.</div>
                        <button class="cp-btn cp-green" data-u="done">✅ PAYMENT DONE</button>
                        <button class="cp-btn cp-ghost" data-u="back">Back</button>
                    </div>`);
                    dim.addEventListener('click', (e) => {
                        const b = e.target.closest('[data-u]');
                        if (!b) return;
                        dim.remove();
                        if (b.dataset.u === 'done') resolve('upi'); else choose();
                    });
                    const box = dim.querySelector('[data-qr]');
                    try {
                        const { data, error } = await sbClient.rpc('active_payment_qr');
                        if (error) throw error;
                        const qr = Array.isArray(data) ? data[0] : data;
                        box.innerHTML = qr && qr.image_url
                            ? `<div class="cp-qr"><img src="${cpEsc(qr.image_url)}" alt="Payment QR"><div class="cp-qr-name">${cpEsc(qr.label)}</div></div>`
                            : '<div class="cp-err">No payment QR is set up yet. Please take cash, or ask Reperi to add the QR in the CRM.</div>';
                    } catch (err) {
                        console.error('QR load failed:', err);
                        box.innerHTML = '<div class="cp-err">Couldn\'t load the QR. Check the internet and try again, or take cash.</div>';
                    }
                };
                choose();
            });
        }

        // Saves how it was paid. Never blocks closing the job.
        async function recordCollection(table, id, method) {
            try {
                const { error } = await sbClient.rpc('record_payment_collection', {
                    p_table: table, p_id: String(id), p_method: method,
                });
                if (error) throw error;
            } catch (err) {
                console.warn('Could not save payment method:', err.message || err);
            }
        }

        // New offer / doorstep bookings show up without a manual refresh.
        setInterval(() => {
            if (!currentWasherId) return;
            fetchOfferBookings(currentWasherId);
            // Don't redraw while the washer is typing an add-on.
            if (!addonDraft.id) fetchDoorstepBookings();
        }, 60000);

        // ── Doorstep washes (one-time car & bike washes) ────────────────
        // From the `bookings` table via washer_doorstep_bookings() — see
        // supabase/doorstep_washes.sql. Only this washer's own bookings.
        async function fetchDoorstepBookings() {
            const box = document.getElementById('doorstepContent');
            try {
                const { data, error } = await sbClient.rpc('washer_doorstep_bookings');
                if (error) throw error;
                await loadDoorAddons();
                displayDoorstepBookings(data || []);
            } catch (err) {
                // Never break the rest of the dashboard over this section.
                console.warn('⚠️ Could not load doorstep washes:', err.message || err);
                box.innerHTML = '';
            }
        }

        function slotText(b) {
            if (!b.slot_date) return '';
            const d = new Date(String(b.slot_date).slice(0, 10) + 'T00:00:00Z');
            const day = isNaN(d) ? String(b.slot_date)
                : d.toLocaleDateString('en-IN', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' });
            return day + (b.slot_time ? ', ' + b.slot_time : '');
        }

        function displayDoorstepBookings(rows) {
            const box = document.getElementById('doorstepContent');
            jobCounts.door = {
                todo: rows.filter((b) => !isOfferDone(b)).length,
                done: rows.filter((b) => isOfferDone(b) && isToday(b.completed_at)).length,
            };
            updateSummary();
            if (!rows.length) { box.innerHTML = ''; return; }
            const key = (b) => new Date(b.slot_start || b.created_at).getTime();
            const open = rows.filter((b) => !isOfferDone(b)).sort((a, b) => key(a) - key(b));
            const done = rows.filter(isOfferDone);

            let html = `<div class="subscriptions-title">🚗 Doorstep washes <span class="count-badge">${open.length} to do</span></div>
                        <div class="subscriptions-list">`;
            [...open, ...done].forEach((b) => {
                const bike = b.vehicle_type === 'two_wheeler';
                const vehicle = [b.vehicle_brand, b.vehicle_model].filter(Boolean).join(' ');
                const address = [b.pickup_address_name, b.pickup_address].filter(Boolean)
                    .filter((x, i, a) => a.indexOf(x) === i).join(' · ');
                html += washCardHtml(b, 'door', {
                    title: b.package_name || 'Doorstep wash',
                    vehicleLine: (bike ? '🏍️ ' : '🚗 ') + (vehicle || (bike ? 'Bike' : 'Car')),
                    plate: b.vehicle_number || '',
                    address: address || 'Not given',
                    price: String(b.package_price ?? '—'),
                    cash: String(b.payment_status || '').toLowerCase() === 'cod',
                });
            });
            html += '</div>';
            box.innerHTML = html;
        }


        // ── Add-on services on doorstep washes ──────────────────────────
        // The washer adds extra work with a price; the customer approves and
        // pays in the app (₹0 = free). The bill waits for unpaid add-ons —
        // see supabase/bills_everywhere.sql.
        let doorAddons = {};
        let addonDraft = {};

        async function loadDoorAddons() {
            try {
                const { data, error } = await sbClient.from('addon_services')
                    .select('id, booking_id, package_name, description, price, package_price, status, reject_reason, created_at')
                    .neq('status', 'Cancelled')
                    .order('created_at', { ascending: true });
                if (error) throw error;
                doorAddons = {};
                (data || []).forEach((a) => {
                    const k = String(a.booking_id);
                    (doorAddons[k] = doorAddons[k] || []).push(a);
                });
            } catch (err) {
                // Add-ons not set up yet — the rest of the card still works.
                console.warn('⚠️ Could not load add-ons:', err.message || err);
            }
        }

        function addonStatusHtml(a) {
            switch (a.status) {
                case 'Paid': return '<span class="addon-pill paid">✓ PAID</span>';
                case 'Free': return '<span class="addon-pill paid">FREE</span>';
                case 'Approved': return '<span class="addon-pill wait">⏳ Customer is paying</span>';
                case 'Rejected': return '<span class="addon-pill no">✕ Rejected</span>';
                default: return '<span class="addon-pill wait">⏳ Waiting for customer</span>';
            }
        }

        function addonSectionHtml(b, finished) {
            const id = escapeHtml(b.id);
            const list = doorAddons[String(b.id)] || [];
            const open = list.filter((a) => a.status === 'Requested' || a.status === 'Approved');
            const formOpen = addonDraft.id === String(b.id);
            const items = list.map((a) => `
                <div class="addon-item">
                    <div class="addon-top">
                        <div class="addon-name">${escapeHtml(a.package_name || 'Add-on')}</div>
                        <div class="addon-price">${a.status === 'Free' || Number(a.price) === 0 ? 'FREE' : escapeHtml(a.package_price || ('₹' + a.price))}</div>
                    </div>
                    ${addonStatusHtml(a)}
                    ${a.status === 'Rejected' && a.reject_reason ? `<div class="addon-reason">Customer: “${escapeHtml(a.reject_reason)}”</div>` : ''}
                    ${a.status === 'Requested' || a.status === 'Approved'
                        ? `<div><button class="addon-cancel" onclick="cancelAddon('${escapeHtml(a.id)}')">Cancel this add-on</button></div>` : ''}
                </div>`).join('');
            if (finished && !list.length) return '';
            const form = formOpen ? `
                <div class="addon-form">
                    <label for="addon-title-${id}">What is it?</label>
                    <input type="text" id="addon-title-${id}" maxlength="120" placeholder="e.g. Interior vacuum"
                           value="${escapeHtml(addonDraft.title || '')}" oninput="addonDraft.title=this.value">
                    <label for="addon-price-${id}">Price ₹ (0 = free)</label>
                    <input type="number" id="addon-price-${id}" inputmode="numeric" min="0" max="500000" step="1" placeholder="e.g. 199"
                           value="${escapeHtml(addonDraft.price ?? '')}" oninput="addonDraft.price=this.value">
                    <label for="addon-note-${id}">Note for the customer (optional)</label>
                    <textarea id="addon-note-${id}" rows="2" maxlength="500" placeholder="Why it's needed"
                              oninput="addonDraft.note=this.value">${escapeHtml(addonDraft.note || '')}</textarea>
                    <label class="addon-photo">
                        ${addonDraft.file ? '✅ Photo added — tap to change' : '📷 Add a photo (optional)'}
                        <input type="file" accept="image/*" hidden onchange="pickAddonPhoto('${id}', this)">
                    </label>
                    <div class="addon-actions">
                        <button class="addon-close" onclick="closeAddonForm()">Close</button>
                        <button class="addon-send" id="addon-send-${id}" onclick="sendAddon('${id}')">SEND</button>
                    </div>
                </div>` : (finished ? '' : `<button class="addon-btn" onclick="openAddonForm('${id}')">➕ ADD-ON SERVICE</button>`);
            return `<div class="photo-step">
                <div class="step-head"><div class="step-num">＋</div><div class="step-title">Extra work</div></div>
                ${finished ? '' : '<div class="step-hint">Found extra work? Add it with a price. The customer approves and pays in their app.</div>'}
                ${list.length ? `<div class="addon-list">${items}</div>` : ''}
                ${form}
                ${open.length ? `<div class="bill-wait">⏳ ${finished ? 'The bill' : "The customer's bill"} will be made once the customer pays or you cancel the unpaid add-on.</div>` : ''}
                <div class="upload-status" id="addon-status-${id}"></div>
            </div>`;
        }

        function openAddonForm(id) {
            addonDraft = { id: String(id) };
            fetchDoorstepBookings().then(() => {
                const el = document.getElementById('addon-title-' + id);
                if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
            });
        }

        function closeAddonForm() {
            addonDraft = {};
            fetchDoorstepBookings();
        }

        function pickAddonPhoto(id, input) {
            const file = input.files && input.files[0];
            if (!file) return;
            addonDraft.file = file;
            fetchDoorstepBookings();
        }

        async function sendAddon(id) {
            const statusDiv = () => document.getElementById('addon-status-' + id);
            const title = (addonDraft.title || '').trim();
            const priceText = String(addonDraft.price ?? '').trim();
            const price = Number(priceText);
            if (!title) { showUploadStatus(statusDiv(), 'error', '❌ Write what the add-on is'); return; }
            if (priceText === '' || !Number.isInteger(price) || price < 0 || price > 500000) {
                showUploadStatus(statusDiv(), 'error', '❌ Enter the price in rupees (0 for free)');
                return;
            }
            const ask = price === 0
                ? `Add "${title}" as FREE?`
                : `Send "${title}" for ₹${price.toLocaleString('en-IN')}?\n\nThe customer approves and pays in their app.`;
            if (!confirm(ask)) return;
            const btn = document.getElementById('addon-send-' + id);
            if (btn) { btn.disabled = true; btn.textContent = 'SENDING…'; }
            try {
                let path = null;
                if (addonDraft.file) {
                    const blob = await shrinkImage(addonDraft.file);
                    path = `washer-photos/${id}/addon-${Date.now()}.jpg`;
                    const { error: upErr } = await sbClient.storage.from('booking-images')
                        .upload(path, blob, { contentType: 'image/jpeg' });
                    if (upErr) throw upErr;
                }
                const { error } = await sbClient.rpc('washer_request_addon', {
                    p_booking_id: String(id),
                    p_title: title,
                    p_description: (addonDraft.note || '').trim(),
                    p_price: price,
                    p_image_path: path,
                });
                if (error) throw error;
                addonDraft = {};
                await fetchDoorstepBookings();
                showUploadStatus(statusDiv(), 'success', price === 0
                    ? '✅ Added as FREE'
                    : '✅ Sent — the customer will approve and pay in their app');
            } catch (err) {
                console.error('Add-on failed:', err);
                if (btn) { btn.disabled = false; btn.textContent = 'SEND'; }
                showUploadStatus(statusDiv(), 'error', '❌ ' + (err.message || 'Could not send'));
            }
        }

        async function cancelAddon(addonId) {
            if (!confirm('Cancel this add-on? The customer won\'t be able to pay for it.')) return;
            try {
                const { error } = await sbClient.rpc('washer_cancel_addon', { p_id: addonId });
                if (error) throw error;
            } catch (err) {
                alert(err.message || 'Could not cancel');
            }
            await fetchDoorstepBookings();
        }

        function toggleSubscription(subscriptionId) {
            const expanded = document.getElementById(`expanded-${subscriptionId}`);
            const btn = document.getElementById(`open-${subscriptionId}`);
            const open = expanded.classList.toggle('show');
            if (btn) btn.textContent = open ? '✕ CLOSE' : "📸 ADD TODAY'S WASH";
        }

        async function uploadServicePhotos(subscriptionId) {
            const beforeInput = document.getElementById(`before-${subscriptionId}`);
            const afterInput = document.getElementById(`after-${subscriptionId}`);
            const statusDiv = document.getElementById(`status-${subscriptionId}`);
            const uploadBtn = event.target;

            if (!beforeInput.files[0] || !afterInput.files[0]) {
                showUploadStatus(statusDiv, 'error', '❌ Take both photos first — tap the blue boxes');
                return;
            }

            // PREVENT DOUBLE CLICK
            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ PROCESSING...';

            try {
                const beforeFile = beforeInput.files[0];
                const afterFile = afterInput.files[0];
                const timestamp = Date.now();

                showUploadStatus(statusDiv, 'success', '📤 Uploading photos...');

                const beforePath = `service-photos/${subscriptionId}/before-${timestamp}.jpg`;
                const afterPath = `service-photos/${subscriptionId}/after-${timestamp}.jpg`;

                console.log('📸 Uploading before photo to:', beforePath);
                const { error: beforeError } = await sbClient.storage
                    .from('subscription-services')
                    .upload(beforePath, beforeFile);

                if (beforeError) {
                    console.error('Before photo error:', beforeError);
                    throw new Error('Before photo upload failed: ' + beforeError.message);
                }

                console.log('✅ Before photo uploaded');
                showUploadStatus(statusDiv, 'success', '📤 Uploading after photo...');

                const { error: afterError } = await sbClient.storage
                    .from('subscription-services')
                    .upload(afterPath, afterFile);

                if (afterError) {
                    console.error('After photo error:', afterError);
                    throw new Error('After photo upload failed: ' + afterError.message);
                }

                console.log('✅ After photo uploaded');
                showUploadStatus(statusDiv, 'success', '⏳ Updating counter...');

                const { data: currentSub, error: fetchError } = await sbClient
                    .from('monthlywash_table')
                    .select('total_services_completed')
                    .eq('id', subscriptionId)
                    .single();

                if (fetchError) {
                    console.error('Fetch error:', fetchError);
                    throw new Error('Could not fetch subscription: ' + fetchError.message);
                }

                console.log('📊 Current subscription:', currentSub);

                const newCount = (currentSub.total_services_completed || 0) + 1;
                console.log('🔢 Updating count to:', newCount);

                const { error: updateError, data: updateData } = await sbClient
                    .from('monthlywash_table')
                    .update({ total_services_completed: newCount })
                    .eq('id', subscriptionId)
                    .select();

                if (updateError) {
                    console.error('Update error:', updateError);
                    throw new Error('Could not update counter: ' + updateError.message);
                }

                console.log('✅ Updated subscription:', updateData);

                // UPDATE WASHERS TABLE WITH INCREMENTED COUNTER
                const { data: washerData, error: washerFetchError } = await sbClient
                    .from('washers')
                    .select('total_services_completed')
                    .eq('id', currentWasherId)
                    .single();

                if (washerFetchError) {
                    console.error('Washer fetch error:', washerFetchError);
                    throw new Error('Could not fetch washer data: ' + washerFetchError.message);
                }

                console.log('📊 Current washer data:', washerData);

                const washerNewCount = (washerData.total_services_completed || 0) + 1;
                console.log('🔢 Updating washer count to:', washerNewCount);

                const { error: washerUpdateError, data: washerUpdateData } = await sbClient
                    .from('washers')
                    .update({ total_services_completed: washerNewCount })
                    .eq('id', currentWasherId)
                    .select();

                if (washerUpdateError) {
                    console.error('Washer update error:', washerUpdateError);
                    throw new Error('Could not update washer counter: ' + washerUpdateError.message);
                }

                console.log('✅ Updated washers table:', washerUpdateData);

                // INSERT RECORD INTO SERVICE_HISTORY TABLE
                const beforeUrlData = sbClient.storage
                    .from('subscription-services')
                    .getPublicUrl(beforePath);

                const afterUrlData = sbClient.storage
                    .from('subscription-services')
                    .getPublicUrl(afterPath);

                const beforeUrl = beforeUrlData?.data?.publicUrl;
                const afterUrl = afterUrlData?.data?.publicUrl;

                console.log('📝 Inserting into service_history:');
                console.log('subscription_id:', subscriptionId);
                console.log('before_photo_url:', beforeUrl);
                console.log('after_photo_url:', afterUrl);

                if (!beforeUrl || !afterUrl) {
                    throw new Error('Failed to generate photo URLs');
                }

                const { error: historyError } = await sbClient
                    .from('service_history')
                    .insert({
                        subscription_id: subscriptionId,
                        before_photo_url: beforeUrl,
                        after_photo_url: afterUrl,
                        created_at: new Date().toISOString(),
                    });

                if (historyError) {
                    console.error('❌ Service history insert error:', historyError);
                    throw new Error('Could not save service history: ' + historyError.message);
                }

                console.log('✅ Service history record created successfully');

                showUploadStatus(statusDiv, 'success', `✅ Service uploaded! (${newCount} total)`);
                
                beforeInput.value = '';
                afterInput.value = '';

                setTimeout(() => {
                    fetchSubscriptions(currentWasherId);
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '✅ UPLOAD & COMPLETE';
                }, 1500);

            } catch (err) {
                console.error('❌ Upload error:', err);
                showUploadStatus(statusDiv, 'error', `❌ ${err.message}`);
                uploadBtn.disabled = false;
                uploadBtn.textContent = '✅ UPLOAD & COMPLETE';
            }
        }

        function showUploadStatus(statusDiv, type, message) {
            statusDiv.textContent = message;
            statusDiv.className = `upload-status ${type}`;
        }

        async function handleLogout() {
            oneSignalLogout();
            await sbClient.auth.signOut();
            window.location.href = 'washerlogin.html';
        }
    </script>
</body>
</html>
