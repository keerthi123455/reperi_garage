<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reperi Washer - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        #loadingScreen {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #D4A017;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #999;
            margin-top: 20px;
            font-size: 14px;
        }

        #dashboardScreen {
            display: none;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .dashboard-header h2 {
            color: #D4A017;
            font-size: 24px;
            font-weight: 900;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        .washer-info {
            background: #262626;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #333;
        }

        .washer-info p {
            color: #999;
            font-size: 13px;
            margin: 5px 0;
        }

        .washer-info .email {
            color: #D4A017;
            font-weight: 600;
        }

        .subscriptions-title {
            color: #D4A017;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subscriptions-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .subscription-card {
            background: #262626;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .subscription-card:hover {
            border-color: #D4A017;
            box-shadow: 0 4px 12px rgba(212, 160, 23, 0.15);
        }

        .subscription-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .subscription-header:hover {
            opacity: 0.8;
        }

        .subscription-vehicle {
            color: #fff;
            font-weight: 700;
            font-size: 15px;
        }

        .subscription-status {
            padding: 4px 10px;
            background: rgba(212, 160, 23, 0.15);
            color: #D4A017;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 8px;
        }

        .expand-icon {
            color: #D4A017;
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .expand-icon.expanded {
            transform: rotate(180deg);
        }

        .subscription-details {
            color: #999;
            font-size: 12px;
            line-height: 1.6;
        }

        .subscription-details p {
            margin: 5px 0;
        }

        .subscription-details strong {
            color: #D4A017;
        }

        .subscription-expanded {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #3a3a3a;
        }

        .subscription-expanded.show {
            display: block;
        }

        .upload-section {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .upload-title {
            color: #D4A017;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .photo-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .photo-input-group {
            flex: 1;
        }

        .photo-input-group label {
            display: block;
            color: #999;
            font-size: 11px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .photo-input-group input[type="file"] {
            display: block;
            width: 100%;
            padding: 8px;
            background: #262626;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #999;
            font-size: 12px;
            cursor: pointer;
        }

        .upload-btn {
            width: 100%;
            padding: 10px;
            background: #D4A017;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .upload-btn:hover:not(:disabled) {
            background: #e6b820;
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .upload-status {
            font-size: 12px;
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }

        .upload-status.success {
            display: block;
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            border: 1px solid #51cf66;
        }

        .upload-status.error {
            display: block;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
        }

        .completed-count {
            color: #D4A017;
            font-weight: 700;
            font-size: 13px;
            margin-top: 10px;
            padding: 8px;
            background: rgba(212, 160, 23, 0.1);
            border-radius: 6px;
            text-align: center;
        }

        #errorScreen {
            display: none;
            text-align: center;
            padding: 60px 20px;
            background: #1a1a1a;
            border-radius: 20px;
            margin: 20px 0;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .error-text {
            color: #ff4444;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .redirect-btn {
            padding: 10px 20px;
            background: #D4A017;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .redirect-btn:hover {
            background: #e6b820;
        }

        .no-subscriptions {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .no-subscriptions p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingScreen">
            <div class="loading-spinner"></div>
            <p class="loading-text">Verifying authentication...</p>
        </div>

        <div id="errorScreen">
            <div class="error-icon">🔐</div>
            <p class="error-text" id="errorText">You must be logged in to access this page</p>
            <button class="redirect-btn" onclick="window.location.href='washerlogin.html'">Go to Login</button>
        </div>

        <div id="dashboardScreen">
            <div class="dashboard-header">
                <h2>Dashboard</h2>
                <button class="logout-btn" onclick="handleLogout()">LOGOUT</button>
            </div>

            <div class="washer-info">
                <p>Welcome, <span class="email" id="washerEmail"></span></p>
                <p>Washer ID: <strong id="washerId"></strong></p>
            </div>

            <div id="subscriptionsContent">
                <div style="text-align: center; padding: 40px; color: #999;">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">Loading subscriptions...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rmvxqjyoqfinbrpubsvp.supabase.co/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdnhxanlvcWZpbmJycHVic3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzQyNDcsImV4cCI6MjA5MjgxMDI0N30.NAxb2XnicLSaBoA4kpTFmmutT68Z2ksu-T-P_NUxy5E';

        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentWasherId = null;

        window.addEventListener('load', async () => {
            console.log('🔍 Starting authentication check...');
            await checkAuthentication();
        });

        async function checkAuthentication() {
            try {
                console.log('📡 Calling getSession()...');
                const { data: { session } } = await sbClient.auth.getSession();
                console.log('✅ Session check complete. Session:', session ? 'Found' : 'Not found');

                if (!session) {
                    console.log('❌ No session found - redirecting to login');
                    showErrorScreen('You must be logged in to access this page');
                    return;
                }

                console.log('✅ User authenticated:', session.user.email);
                showDashboard(session.user.email);
            } catch (err) {
                console.error('❌ Auth error:', err);
                showErrorScreen(`Authentication error: ${err.message}`);
            }
        }

        function showErrorScreen(message) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('errorScreen').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        async function showDashboard(email) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            document.getElementById('washerEmail').textContent = email;
            await fetchWasherData(email);
        }

        async function fetchWasherData(email) {
            try {
                const { data: washerData, error: washerError } = await sbClient
                    .from('washers')
                    .select('id, email')
                    .eq('email', email)
                    .single();

                if (washerError) throw new Error('Washer profile not found');

                currentWasherId = washerData.id;
                document.getElementById('washerId').textContent = currentWasherId;
                console.log('✅ Washer found:', { id: currentWasherId, email });

                await fetchSubscriptions(currentWasherId);
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('subscriptionsContent').innerHTML = `
                    <div class="no-subscriptions">
                        <p>❌ Error: ${err.message}</p>
                    </div>
                `;
            }
        }

        async function fetchSubscriptions(washerId) {
            try {
                console.log('🔍 Fetching subscriptions for washer_id:', washerId);

                const { data: subscriptions, error } = await sbClient
                    .from('subscriptions')
                    .select('*')
                    .eq('washer_id', washerId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                console.log('✅ Subscriptions fetched:', subscriptions);
                displaySubscriptions(subscriptions);
            } catch (err) {
                console.error('Error fetching subscriptions:', err);
                document.getElementById('subscriptionsContent').innerHTML = `
                    <div class="no-subscriptions">
                        <p>❌ Error loading subscriptions: ${err.message}</p>
                    </div>
                `;
            }
        }

        function displaySubscriptions(subscriptions) {
            const content = document.getElementById('subscriptionsContent');

            if (!subscriptions || subscriptions.length === 0) {
                content.innerHTML = `
                    <div class="no-subscriptions">
                        <p>📋 No subscriptions assigned yet</p>
                    </div>
                `;
                return;
            }

            let html = `<div class="subscriptions-title">Your Subscriptions (${subscriptions.length})</div>
                       <div class="subscriptions-list">`;

            subscriptions.forEach((sub) => {
                const totalCompleted = sub.total_services_completed || 0;
                html += `
                    <div class="subscription-card">
                        <div class="subscription-header" onclick="toggleSubscription(${sub.id})">
                            <div>
                                <div class="subscription-vehicle">${sub.car_brand || 'Vehicle'} ${sub.car_model || ''}</div>
                                <div class="subscription-status">${sub.status || 'Active'}</div>
                            </div>
                            <span class="expand-icon" id="icon-${sub.id}">▼</span>
                        </div>

                        <div class="subscription-details">
                            <p><strong>Vehicle ID:</strong> ${sub.vehicle_id || 'N/A'}</p>
                            <p><strong>Subscription Type:</strong> ${sub.subscription_type || 'N/A'}</p>
                            <p><strong>Price:</strong> ₹${sub.price || '0'}</p>
                            <p><strong>Frequency:</strong> ${sub.frequency || 'N/A'}</p>
                            <p><strong>Date Started:</strong> ${new Date(sub.created_at).toLocaleDateString('en-IN')}</p>
                        </div>

                        <div class="subscription-expanded" id="expanded-${sub.id}">
                            <div class="upload-section">
                                <div class="upload-title">📸 Add Today's Service</div>
                                <div class="photo-inputs">
                                    <div class="photo-input-group">
                                        <label for="before-${sub.id}">Before Photo</label>
                                        <input type="file" id="before-${sub.id}" accept="image/*" />
                                    </div>
                                    <div class="photo-input-group">
                                        <label for="after-${sub.id}">After Photo</label>
                                        <input type="file" id="after-${sub.id}" accept="image/*" />
                                    </div>
                                </div>
                                <button class="upload-btn" onclick="uploadServicePhotos(${sub.id})">UPLOAD & COMPLETE</button>
                                <div class="upload-status" id="status-${sub.id}"></div>
                                <div class="completed-count">✅ Services Completed: <strong>${totalCompleted}</strong></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            content.innerHTML = html;
        }

        function toggleSubscription(subscriptionId) {
            const expanded = document.getElementById(`expanded-${subscriptionId}`);
            const icon = document.getElementById(`icon-${subscriptionId}`);
            expanded.classList.toggle('show');
            icon.classList.toggle('expanded');
        }

        async function uploadServicePhotos(subscriptionId) {
            const beforeInput = document.getElementById(`before-${subscriptionId}`);
            const afterInput = document.getElementById(`after-${subscriptionId}`);
            const statusDiv = document.getElementById(`status-${subscriptionId}`);
            const uploadBtn = event.target;

            if (!beforeInput.files[0] || !afterInput.files[0]) {
                showUploadStatus(statusDiv, 'error', '❌ Please select both photos');
                return;
            }

            // PREVENT DOUBLE CLICK
            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ PROCESSING...';

            try {
                const beforeFile = beforeInput.files[0];
                const afterFile = afterInput.files[0];
                const timestamp = Date.now();

                showUploadStatus(statusDiv, 'success', '📤 Uploading photos...');

                const beforePath = `service-photos/${subscriptionId}/before-${timestamp}.jpg`;
                const afterPath = `service-photos/${subscriptionId}/after-${timestamp}.jpg`;

                console.log('📸 Uploading before photo to:', beforePath);
                const { error: beforeError } = await sbClient.storage
                    .from('subscription-services')
                    .upload(beforePath, beforeFile);

                if (beforeError) {
                    console.error('Before photo error:', beforeError);
                    throw new Error('Before photo upload failed: ' + beforeError.message);
                }

                console.log('✅ Before photo uploaded');
                showUploadStatus(statusDiv, 'success', '📤 Uploading after photo...');

                const { error: afterError } = await sbClient.storage
                    .from('subscription-services')
                    .upload(afterPath, afterFile);

                if (afterError) {
                    console.error('After photo error:', afterError);
                    throw new Error('After photo upload failed: ' + afterError.message);
                }

                console.log('✅ After photo uploaded');
                showUploadStatus(statusDiv, 'success', '⏳ Updating counter...');

                const { data: currentSub, error: fetchError } = await sbClient
                    .from('subscriptions')
                    .select('total_services_completed')
                    .eq('id', subscriptionId)
                    .single();

                if (fetchError) {
                    console.error('Fetch error:', fetchError);
                    throw new Error('Could not fetch subscription: ' + fetchError.message);
                }

                console.log('📊 Current subscription:', currentSub);

                const newCount = (currentSub.total_services_completed || 0) + 1;
                console.log('🔢 Updating count to:', newCount);

                const { error: updateError, data: updateData } = await sbClient
                    .from('subscriptions')
                    .update({ total_services_completed: newCount })
                    .eq('id', subscriptionId)
                    .select();

                if (updateError) {
                    console.error('Update error:', updateError);
                    throw new Error('Could not update counter: ' + updateError.message);
                }

                console.log('✅ Updated subscription:', updateData);

                // UPDATE WASHERS TABLE WITH INCREMENTED COUNTER
                const { data: washerData, error: washerFetchError } = await sbClient
                    .from('washers')
                    .select('total_services_completed')
                    .eq('id', currentWasherId)
                    .single();

                if (washerFetchError) {
                    console.error('Washer fetch error:', washerFetchError);
                    throw new Error('Could not fetch washer data: ' + washerFetchError.message);
                }

                console.log('📊 Current washer data:', washerData);

                const washerNewCount = (washerData.total_services_completed || 0) + 1;
                console.log('🔢 Updating washer count to:', washerNewCount);

                const { error: washerUpdateError, data: washerUpdateData } = await sbClient
                    .from('washers')
                    .update({ total_services_completed: washerNewCount })
                    .eq('id', currentWasherId)
                    .select();

                if (washerUpdateError) {
                    console.error('Washer update error:', washerUpdateError);
                    throw new Error('Could not update washer counter: ' + washerUpdateError.message);
                }

                console.log('✅ Updated washers table:', washerUpdateData);

                // INSERT RECORD INTO SERVICE_HISTORY TABLE
                const beforeUrl = sbClient.storage
                    .from('subscription-services')
                    .getPublicUrl(beforePath).data.publicUrl;

                const afterUrl = sbClient.storage
                    .from('subscription-services')
                    .getPublicUrl(afterPath).data.publicUrl;

                console.log('📝 Inserting into service_history:');
                console.log('subscription_id:', subscriptionId);
                console.log('before_photo_url:', beforeUrl);
                console.log('after_photo_url:', afterUrl);

                const { error: historyError } = await sbClient
                    .from('service_history')
                    .insert({
                        subscription_id: subscriptionId,
                        status: 'Not Completed',
                        before_photo_url: beforeUrl,
                        after_photo_url: afterUrl,
                        created_at: new Date().toISOString(),
                    });

                if (historyError) {
                    console.error('❌ Service history insert error:', historyError);
                    throw new Error('Could not save service history: ' + historyError.message);
                }

                console.log('✅ Service history record created successfully');

                showUploadStatus(statusDiv, 'success', `✅ Service uploaded! (${newCount} total)`);
                
                beforeInput.value = '';
                afterInput.value = '';

                setTimeout(() => {
                    fetchSubscriptions(currentWasherId);
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'UPLOAD & COMPLETE';
                }, 1500);

            } catch (err) {
                console.error('❌ Upload error:', err);
                showUploadStatus(statusDiv, 'error', `❌ ${err.message}`);
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'UPLOAD & COMPLETE';
            }
        }

        function showUploadStatus(statusDiv, type, message) {
            statusDiv.textContent = message;
            statusDiv.className = `upload-status ${type}`;
        }

        async function handleLogout() {
            await sbClient.auth.signOut();
            window.location.href = 'washerlogin.html';
        }
    </script>
</body>
</html>
