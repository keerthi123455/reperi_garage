function exportAddonsCsv(list) {
  const cols = [['id', 'id'], ['booking_id', 'booking_id'], ['created_at', 'created'], ['package_name', 'add_on'], ['description', 'description'],
    ['customer', 'customer'], ['phone', 'phone'], ['vehicle', 'vehicle'], ['garage', 'garage'], ['status', 'status'], ['reject_reason', 'reject_reason'],
    ['price', 'amount'], ['razorpay_order_id', 'razorpay_order_id'], ['razorpay_payment_id', 'razorpay_payment_id'],
    ['approved_at', 'approved_at'], ['paid_at', 'paid_at'], ['rejected_at', 'rejected_at'], ['test', 'test']];
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = [cols.map((c) => c[1]).join(',')].concat(list.map((a) => cols.map(([k]) => q(/_at$/.test(k) && a[k] ? fmtDT(a[k]) : a[k])).join(','))).join('\n');
  const el = document.createElement('a');
  el.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  el.download = `reperi-addons-${todayIST()}.csv`;
  el.click();
  setTimeout(() => URL.revokeObjectURL(el.href), 1000);
}

function bindRows() {

  document.querySelectorAll('[data-filter-q]').forEach((el) => el.addEventListener('click', () => go('bookings', { q: el.dataset.filterQ, status: 'all', type: 'all', pay: 'all' })));
  document.querySelectorAll('[data-doc]').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); openDoc(el.dataset.doc, el.dataset.bucket); }));

async function openDoc(path, bucket) {
  const win = window.open('', '_blank');
  try {
    const { url } = await api('doc', { path, bucket });
    if (win) win.location = url; else window.location.href = url;
  } catch (e) {
    if (win) win.close();
    alert(e.message || "Couldn't open the document.");
  }
}

// Made automatically when a job is done. Here staff can download the
// current bill, make one now, or override it with their own items (the old
// one is kept as "replaced"; the customer is notified and sees the new one).
const INVOICE_TABLES = new Set(['bookings', 'offer_bookings', 'pollution_booking', 'inspection_booking', 'claim_table', 'monthlywash_table', 'fleet_pickup_requests']);
function billSection(j, d) {
  const list = d.invoices || [];
  const cur = list.find((i) => i.status === 'issued');
  const old = list.filter((i) => i.status !== 'issued');
  const seed = cur && Array.isArray(cur.lines) && cur.lines.length
    ? cur.lines
    : [{ name: j.title || 'Service', amount: Number(j.amount) || 0, gst: 18 }];
  const rowHtml = (l) => `<div data-bill-row style="display:grid;grid-template-columns:minmax(120px,1fr) 110px 74px 60px 28px;gap:6px;align-items:center;margin-top:6px">
      <input class="input" data-k="name" value="${esc(l.name || '')}" placeholder="Item" style="height:36px">
      <input class="input" data-k="amount" type="number" step="0.01" value="${l.free ? 0 : esc(l.amount ?? '')}" placeholder="₹ incl. GST" style="height:36px">
      <select class="select" data-k="gst" style="height:36px"><option value="18" ${Number(l.gst) !== 5 ? 'selected' : ''}>18%</option><option value="5" ${Number(l.gst) === 5 ? 'selected' : ''}>5%</option></select>
      <label class="secondary" style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-k="free" ${l.free || Number(l.amount) === 0 ? 'checked' : ''}>Free</label>
      <button type="button" class="btn-link" data-bill-del title="Remove" style="color:var(--red);font-size:16px">✕</button>
    </div>`;
  return `<h4>Bill</h4>
    <div class="card" style="padding:14px">
      ${cur ? `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">
          <div><div class="mono" style="font-weight:800;word-break:break-all">${esc(cur.invoice_no)}</div>
            <div class="secondary">${fmtDT(cur.created_at)} · ${cur.created_by === 'auto' ? 'made automatically' : 'by ' + esc(cur.created_by)}${cur.reason ? ' · “' + esc(cur.reason) + '”' : ''}</div></div>
          <b style="font-size:18px">${inr(cur.total)}</b></div>`
        : `<div class="secondary">No bill yet — it's made automatically when the job is done. You can make it now.</div>`}
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
        ${cur ? `<button class="btn" data-doc="${esc(cur.pdf_path)}" data-bucket="invoices">⬇ Download PDF</button>` : `<button class="btn btn-primary" data-bill-now>Make bill now</button>`}
        <button class="btn" data-bill-edit>✎ ${cur ? 'Override bill' : 'Make with my own items'}</button>
      </div>
      <form data-bill-form class="hidden" style="margin-top:12px">
        <div class="secondary">Prices include GST. 18% for services and parts, 5% for pickup &amp; drop. Tick Free (or price 0) to show FREE. Use a negative price for a discount.</div>
        <div data-bill-rows>${seed.map(rowHtml).join('')}</div>
        <button type="button" class="btn-link" data-bill-add style="color:var(--blue);margin-top:8px">＋ Add item</button>
        <input class="input" name="reason" placeholder="Reason (e.g. goodwill discount, wrong add-on price)" style="margin-top:8px">
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px">
          <b data-bill-total></b><span style="flex:1"></span><span class="secondary" data-bill-status></span>
          <button class="btn btn-primary" type="submit">Issue new bill &amp; notify customer</button>
        </div>
      </form>
      ${old.length ? `<div class="secondary" style="margin-top:12px">Replaced bills: ${old.map((o) => `<button class="btn-link" style="color:var(--blue);margin-right:8px" data-doc="${esc(o.pdf_path)}" data-bucket="invoices">${esc(o.invoice_no)}</button>`).join('')}</div>` : ''}
    </div>
    <template data-bill-row-tpl>${rowHtml({ name: '', amount: '', gst: 18 })}</template>`;
}
function bindBill(j) {
  const body = $('dBody');
  const form = body.querySelector('[data-bill-form]');
  if (!form) return;
  const rows = form.querySelector('[data-bill-rows]');
  const readLines = () => [...rows.querySelectorAll('[data-bill-row]')].map((r) => ({
    name: r.querySelector('[data-k="name"]').value.trim(),
    amount: r.querySelector('[data-k="free"]').checked ? 0 : Number(r.querySelector('[data-k="amount"]').value || 0),
    gst: Number(r.querySelector('[data-k="gst"]').value),
    free: r.querySelector('[data-k="free"]').checked,
  })).filter((l) => l.name);
  const total = () => { form.querySelector('[data-bill-total]').textContent = 'New total ' + inr(readLines().reduce((s, l) => s + (l.amount || 0), 0)); };
  const wire = () => rows.querySelectorAll('[data-bill-del]').forEach((b) => b.onclick = () => { b.closest('[data-bill-row]').remove(); total(); });
  wire(); total();
  form.addEventListener('input', total); form.addEventListener('change', total);
  body.querySelector('[data-bill-edit]').onclick = () => form.classList.toggle('hidden');
  form.querySelector('[data-bill-add]').onclick = () => {
    rows.insertAdjacentHTML('beforeend', body.querySelector('[data-bill-row-tpl]').innerHTML); wire(); total();
  };
  const issue = async (payload, statusEl, btn) => {
    btn.disabled = true; statusEl.style.color = ''; statusEl.textContent = 'Making the bill…';
    try {
      await api('invoice_issue', { table: j.table, id: j.id, ...payload });
      statusEl.style.color = 'var(--green)'; statusEl.textContent = 'Done ✓ — customer notified';
      await openJob(j.table, j.id);
    } catch (e) {
      statusEl.style.color = 'var(--red)'; statusEl.textContent = e.message || "Couldn't make the bill";
      btn.disabled = false;
    }
  };
  form.onsubmit = (e) => {
    e.preventDefault();
    const lines = readLines();
    if (!lines.length) { form.querySelector('[data-bill-status]').textContent = 'Add at least one item.'; return; }
    issue({ lines, reason: form.reason.value }, form.querySelector('[data-bill-status]'), form.querySelector('button[type="submit"]'));
  };
  const now = body.querySelector('[data-bill-now]');
  if (now) now.onclick = () => issue({}, form.querySelector('[data-bill-status]'), now);
}

async function openJob(table, id) {
  const j = state.model.jobs.find((x) => x.table === table && String(x.id) === String(id));
  if (!j) return;
  $('dType').className = 'pill ' + (TYPE_TONE[j.type] || ''); $('dType').textContent = j.type + (j.test ? ' · TEST' : '');
  $('dTitle').textContent = j.title;
  $('dSub').textContent = `#${j.id} · ${fmtDT(j.created)} · ${ago(j.created)}`;
  $('dBody').innerHTML = summaryHtml(j) + '<div class="skel" style="margin-top:20px;height:120px"></div>';
  $('drawer').classList.add('on'); $('scrim').classList.add('on'); $('drawer').setAttribute('aria-hidden', 'false');
  try {
    const d = await api('detail', { table, id });
    $('dBody').innerHTML = summaryHtml(j) + (ASSIGN_TABLES.has(table) ? assignSection(j, d) : '') + (d.inspection21 ? inspection21Section(d.inspection21) : '') + detailHtml(j, d) + (INVOICE_TABLES.has(table) ? billSection(j, d) : '');
    if (ASSIGN_TABLES.has(table)) bindAssign(j);
    if (d.inspection21) bindInspection21(j);
    if (INVOICE_TABLES.has(table)) bindBill(j);
    $('dBody').querySelectorAll('[data-doc]').forEach((el) => el.addEventListener('click', () => openDoc(el.dataset.doc, el.dataset.bucket)));
  } catch (e) {
    if (e.message !== 'signed_out') $('dBody').insertAdjacentHTML('beforeend', `<div class="banner">${esc(e.message)}</div>`);
    $('dBody').querySelector('.skel')?.remove();
  }
}
function summaryHtml(j) {
  const rows = [
    ['Status', statusPill(j)], ['Payment', payPill(j) + ` <b style="margin-left:6px">${j.enquiry ? esc(j.priceText || '') : inr(j.amount)}</b>`],
    ['Customer', esc(j.customer)], ['Phone', j.phone ? `<a href="tel:${esc(j.phone)}">${esc(j.phone)}</a>` : '—'], ['Email', esc(j.email || '—')],
    ['Vehicle', esc(j.vehicle || '—') + (j.vehicleType ? ' ' + pill(titleCase(j.vehicleType)) : '')],
    ['Garage', esc(j.garage || '—')], ['Delivery partner', esc(j.deliveryName || '—')], ['Washer', esc(j.washerName || '—')],
    ['Pickup & drop', j.pickup ? 'Yes' : 'No'], ['Address', esc(j.address || '—')],
  ];
  const via = j.raw && j.raw.payment_collected_via;
  if (via) rows.push(['Collected by', pill(via === 'upi' ? 'UPI (our QR)' : 'Cash', via === 'upi' ? 'blue' : 'green') + (j.raw.payment_collected_at ? ` <span class="secondary">${fmtDT(j.raw.payment_collected_at)}</span>` : '')]);
  if (j.coupon) rows.push(['Coupon', '<b>' + esc(j.coupon) + '</b>' + (j.couponOff ? ' · ₹' + esc(j.couponOff) + ' off (amount shown is after discount)' : '')]);
  if (j.slot) rows.push(['Slot', esc(j.slot) + (j.slotMode ? ' · <b>' + esc(j.slotMode) + '</b>' : '')]);
  if (j.table === 'monthlywash_table') rows.push(['Plan period', `${fmtD(j.start)} → ${fmtD(j.end)}`], ['Washes done', num(j.washes)]);
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
function detailHtml(j, d) {
  const r = d.row || {};
  let html = '';
  const times = STAGE_TIMES.filter(([k]) => r[k]).map(([k, l]) => ({ k, l, t: r[k] })).sort((a, b) => new Date(a.t) - new Date(b.t));
  if (times.length > 1) html += `<h4>Timeline</h4><ul class="timeline">${times.map((x) => `<li><div><b>${x.l}</b></div><div class="when">${fmtDT(x.t)}</div></li>`).join('')}</ul>`;
  if (r.inspection_stage) {
    const ph = Array.isArray(r.inspection_photos) ? r.inspection_photos : [];
    html += `<h4>Inspection visit · ${esc(INSP_STATUS[r.inspection_stage] || r.inspection_stage)}</h4>`
      + `<div class="secondary">Assigned ${fmtDT(r.inspection_assigned_at)} · On the way ${fmtDT(r.inspection_on_the_way_at)} · Analyzing ${fmtDT(r.inspection_analyzing_at)} · Completed ${fmtDT(r.inspection_completed_at)}</div>`
      + (ph.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${ph.map((p, i) => `<button class="btn" data-doc="${esc(p)}" data-bucket="inspection-photos">📷 Photo ${i + 1}</button>`).join('')}</div>` : '');
  }
  if (d.updates?.length) html += `<h4>Garage updates</h4><ul class="timeline">${d.updates.map((u) => `<li><div><b>${esc(u.stage || 'Update')}</b></div>${u.description ? `<div>${esc(u.description)}</div>` : ''}<div class="when">${fmtDT(u.created_at)}${u.image_url || u.photo_url ? ` · <button class="btn-link" style="color:var(--blue)" data-doc="${esc(u.image_url || u.photo_url)}" data-bucket="booking-images">${/\.(mp4|mov|m4v|webm|3gp)$/i.test(u.image_url || u.photo_url || '') ? '▶ Video' : 'Photo'}</button>` : ''}</div></li>`).join('')}</ul>`;
  if (d.addons?.length) {
    const paidSum = d.addons.filter((a) => a.status === 'Paid').reduce((s, a) => s + Number(a.price || 0), 0);
    html += `<h4>Add-ons (${d.addons.length})${paidSum ? ` · ${inr(paidSum)} paid` : ''}</h4><ul class="timeline">${d.addons.map((a) => `<li><div><b>${esc(a.package_name || 'Add-on')}</b> · <b>${inr(Number(a.price || 0))}</b> ${addonPill(a)}</div>${a.description ? `<div>${esc(a.description)}</div>` : ''}${a.status === 'Rejected' && a.reject_reason ? `<div style="color:var(--red)">Customer: “${esc(a.reject_reason)}”</div>` : ''}<div class="when">${fmtDT(a.created_at)}${a.razorpay_payment_id ? ` · <span class="mono">${esc(a.razorpay_payment_id)}</span>` : ''}${a.image_path ? ` · <button class="btn-link" style="color:var(--blue)" data-doc="${esc(a.image_path)}" data-bucket="booking-images">Photo</button>` : ''}</div></li>`).join('')}</ul>`;
  }
  if (d.washes?.length) html += `<h4>Washes (${d.washes.length})</h4><ul class="timeline">${d.washes.map((w) => `<li><div><b>Wash completed</b></div><div class="when">${fmtDT(w.created_at)} · ${photoLinks([w.before_photo_url, w.after_photo_url], 'subscription-services', ['Before', 'After'])}</div></li>`).join('')}</ul>`;
  const docs = DOC_FIELDS.filter((k) => r[k]);
  if (docs.length) html += `<h4>Documents</h4><div style="display:flex;flex-wrap:wrap;gap:8px">${docs.map((k) => `<button class="btn" data-doc="${esc(r[k])}" data-bucket="insurance-documents">${titleCase(k.replace(/_url$/, '').replace('owner_', ''))}</button>`).join('')}</div>`;
  if (j.table === 'offer_bookings') {
    const ph = [['before_photo_url', 'Before'], ['during_photo_url', 'During'], ['after_photo_url', 'After']].filter(([k]) => r[k]);
    if (ph.length) html += `<h4>Wash photos</h4><div style="display:flex;gap:10px;flex-wrap:wrap">${ph.map(([k, l]) => `<a href="${esc(r[k])}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;color:inherit"><img src="${esc(r[k])}" alt="${l}" style="width:110px;height:110px;object-fit:cover;border-radius:10px;display:block"><div class="secondary" style="margin-top:4px">${l}</div></a>`).join('')}</div>`;
  }
  if (j.table === 'resolve_requests') {
    const media = Array.isArray(r.media) ? r.media : [];
    if (media.length) html += `<h4>Photos & videos (${media.length})</h4><div style="display:flex;flex-wrap:wrap;gap:8px">${media.map((m, i) => `<button class="btn" data-doc="${esc(m.path)}" data-bucket="resolve-media">${m.type === 'video' ? '▶ Video' : 'Photo'} ${i + 1}</button>`).join('')}</div>`;
    if (r.description) html += `<h4>Customer says</h4><div>${esc(r.description)}</div>`;
    if (r.dealer_quote_amount != null || r.dealer_quote_path) html += `<h4>Dealer quote</h4><div>${r.dealer_quote_amount != null ? `<b>${inr(r.dealer_quote_amount)}</b>` : ''} ${r.dealer_quote_path ? `<button class="btn" style="margin-left:8px" data-doc="${esc(r.dealer_quote_path)}" data-bucket="resolve-media">View quote</button>` : ''}</div>`;
    if (r.quoted_price != null) html += `<h4>Price sent</h4><div><b>${inr(r.quoted_price)}</b>${r.quote_note ? ` — ${esc(r.quote_note)}` : ''}${r.quote_image_path ? ` <button class="btn" style="margin-left:8px" data-doc="${esc(r.quote_image_path)}" data-bucket="resolve-media">View photo</button>` : ''}</div>`;
    if (Array.isArray(r.garage_photos) && r.garage_photos.length) html += `<h4>Photos from the garage (${r.garage_photos.length})</h4><div style="display:flex;flex-wrap:wrap;gap:8px">${r.garage_photos.map((p, i) => `<button class="btn" data-doc="${esc(p)}" data-bucket="booking-images">Photo ${i + 1}</button>`).join('')}</div>`;
    html += `<div style="color:var(--muted);margin-top:10px">Assign a garage, or send / update the price, from the <b>After service issue</b> tab.</div>`;
  }
  if (r.damage_description) html += `<h4>Damage description</h4><div>${esc(r.damage_description)}</div>`;
  if (Array.isArray(r.bill_items) && r.bill_items.length) html += `<h4>Bill</h4><dl class="kv">${r.bill_items.map((b) => `<dt>${esc(b.name)}</dt><dd>${inr(b.price)}</dd>`).join('')}</dl>`;
  if (d.chats?.length) html += `<h4>Chat (${d.chats.length})</h4><div class="chat">${d.chats.map((c) => { const me = c.sender === 'admin' || c.sender_type === 'admin'; return `<div class="bubble ${me ? 'me' : ''}"><div><b>${esc(me ? 'Garage' : (c.sender_name || 'Customer'))}</b> ${esc(c.message)}</div><div class="when">${fmtDT(c.created_at)}</div></div>`; }).join('')}</div>`;
  if (d.intent) html += `<h4>Checkout</h4><dl class="kv"><dt>Status</dt><dd>${esc(d.intent.status)}</dd><dt>Method</dt><dd>${esc(d.intent.payment_method)}</dd><dt>Amount</dt><dd>${inr(d.intent.amount)}</dd><dt>Razorpay payment</dt><dd class="mono">${esc(d.intent.razorpay_payment_id || '—')}</dd><dt>Razorpay order</dt><dd class="mono">${esc(d.intent.razorpay_order_id || '—')}</dd></dl>`;
  const rest = Object.entries(r).filter(([k, v]) => v !== null && v !== '' && !SKIP_FIELDS.has(k) && !DOC_FIELDS.includes(k) && !STAGE_TIMES.some(([t]) => t === k) && typeof v !== 'object');
  html += `<h4>All fields</h4><dl class="kv">${rest.map(([k, v]) => `<dt>${esc(titleCase(k))}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  return html;
}

// ─────────────────────────────── Boot ─────────────────────────────────
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); return; }
  const email = (session.user?.email || '').toLowerCase();
  if (!email.endsWith('@' + DOMAIN)) { await sb.auth.signOut(); showLogin(`Only @${DOMAIN} accounts can open the CRM.`); return; }
  try { await enterApp(); } catch (e) { if (e.message !== 'signed_out' && e.message !== 'forbidden') showLogin(e.message); }
})();
})();
</script>
