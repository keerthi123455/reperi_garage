<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reperi Washer Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .login-box {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            color: #D4A017;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #999;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #D4A017;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #262626;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #D4A017;
            background: #2a2a2a;
            box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.1);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #D4A017;
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .login-button:hover:not(:disabled) {
            background: #e6b820;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 160, 23, 0.3);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            border-left: 3px solid #ff6b6b;
            display: none;
            line-height: 1.4;
        }

        .success-message {
            color: #51cf66;
            font-size: 12px;
            margin-top: 12px;
            padding: 12px;
            background: rgba(81, 207, 102, 0.1);
            border-radius: 8px;
            border-left: 3px solid #51cf66;
            display: none;
        }

        .loading-state {
            display: none;
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 15px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #333;
            border-top: 2px solid #D4A017;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-text {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 30px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon::before {
            content: attr(data-icon);
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #D4A017;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>⚙️ REPERI</h1>
                <p>Washer Portal</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">📧 Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="washer_john@example.com" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">🔐 Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    LOGIN
                </button>

                <div class="error-message" id="errorMsg"></div>
                <div class="success-message" id="successMsg"></div>

                <div class="loading-state" id="loadingState">
                    <div class="spinner"></div>
                    <span>Logging in...</span>
                </div>
            </form>

            <div class="footer-text">
                © 2026 Reperi Garage. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        // ⚠️ UPDATE THESE WITH YOUR SUPABASE CREDENTIALS
        const SUPABASE_URL = 'https://rmvxqjyoqfinbrpubsvp.supabase.co/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtdnhxanlvcWZpbmJycHVic3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzQyNDcsImV4cCI6MjA5MjgxMDI0N30.NAxb2XnicLSaBoA4kpTFmmutT68Z2ksu-T-P_NUxy5E';

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if already logged in
        window.addEventListener('load', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'washer-dashboard.html';
            }
        });

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const loginBtn = document.getElementById('loginBtn');
            const loadingState = document.getElementById('loadingState');

            // Clear messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Validate
            if (!email || !password) {
                errorMsg.textContent = '❌ Please enter both email and password';
                errorMsg.style.display = 'block';
                return;
            }

            // Extract username from email (part before @)
            const username = email.split('@')[0].toLowerCase();

            // Check if username starts with "washer"
            if (!username.startsWith('washer')) {
                errorMsg.textContent = '❌ Invalid washer account. Username must start with "washer"';
                errorMsg.style.display = 'block';
                return;
            }

            // Disable button and show loading
            loginBtn.disabled = true;
            loadingState.style.display = 'block';

            try {
                // Login with Supabase Auth
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password,
                });

                if (error) {
                    throw new Error(error.message);
                }

                // Success
                successMsg.textContent = '✅ Login successful! Redirecting...';
                successMsg.style.display = 'block';

                // Wait 1 second then redirect
                setTimeout(() => {
                    window.location.href = 'washer-dashboard.html';
                }, 1000);

            } catch (err) {
                errorMsg.textContent = '❌ ' + (err.message || 'Login failed. Please try again.');
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loadingState.style.display = 'none';
            }
        }
    </script>
</body>
</html>
