[functions.create-razorpay-order]
enabled = true
verify_jwt = false
import_map = "./functions/create-razorpay-order/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-razorpay-order/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-razorpay-order/*.html" ]

[functions.verify-razorpay-payment]
enabled = true
verify_jwt = false
import_map = "./functions/verify-razorpay-payment/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/verify-razorpay-payment/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/verify-razorpay-payment/*.html" ]

[functions.notify-on-db-change]
enabled = true
verify_jwt = false
import_map = "./functions/notify-on-db-change/deno.json"
entrypoint = "./functions/notify-on-db-change/index.ts"

[functions.ask-ai-chat]
enabled = true
verify_jwt = false
entrypoint = "./functions/ask-ai-chat/index.ts"
# Server-side pricing, booking & assignment (see supabase/functions/_shared/booking.ts).
# verify_jwt is off because the function checks the user itself (fleet
# payments have no Supabase user) and Razorpay's webhook carries no JWT.
[functions.booking-api]
enabled = true
verify_jwt = false
entrypoint = "./functions/booking-api/index.ts"

[functions.razorpay-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/razorpay-webhook/index.ts"

# Internal CRM dashboard (web/crm.html). Checks the caller itself: Supabase
# Auth session with a confirmed @trustkon.com email.
[functions.crm-api]
enabled = true
verify_jwt = false
entrypoint = "./functions/crm-api/index.ts"
